<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="https://glitch.com/favicon.ico" />
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.6.1/dist/aframe-extras.min.js"></script>
  <script src="https://unpkg.com/aframe-rounded@1.0.3/dist/aframe-rounded.min.js"></script>
  <!-- Local: lazy external-clip player (replaces per-move src swapping) -->
  <script src="src/clip-player.js"></script>
  <title>Capoeira VR Trainer</title>
  <style>
    .a-dialog-text {
      color: white;
      font-size: 24px;
    }
  </style>
</head>

<body>
  <!-- Desktop (non-VR) controls hint. desktop-fallback.js shows/hides this. -->
  <div id="desktopHint" style="position:fixed;left:12px;bottom:12px;z-index:9999;
    font-family:system-ui,sans-serif;font-size:13px;line-height:1.5;color:#fff;
    background:rgba(13,27,42,.82);padding:10px 14px;border-radius:8px;max-width:320px;
    display:none;pointer-events:none">
    <b style="color:#ffd93d">Desktop controls</b><br>
    <b>Space</b> start &nbsp; <b>1/2/3</b> difficulty<br>
    <b>W A S D</b> move &nbsp; drag mouse to look<br>
    <b>J</b> attack &nbsp; <b>K</b> defensive &nbsp; <b>R</b> roda<br>
    <b>Shift</b> slow-mo &nbsp; <b>T</b> turn &nbsp; <b>H</b> help &nbsp; <b>E</b> end<br>
    <span style="color:#9fb3c8">Walk in with W so your kicks/blocks reach the opponent.</span>
  </div>

  <a-scene vr-mode-ui="enabled: true" desktop-fallback>
    <a-assets>
      <!-- Textured opponent mesh (loaded once); animations are lazy external clips. -->
      <a-asset-item id="opponent" src="assets/opponent.glb"></a-asset-item>
      <audio id="audio" src="assets/Luna.ogg"></audio>
    </a-assets>

    <a-entity id="cameraRig" position="0 0 0">
      <a-entity id="camera" camera="active: true" look-controls wasd-controls="enabled:true;" position="0 1.6 0">
        <!-- Screen flash overlay for hit feedback -->
        <a-plane id="screenFlash" position="0 0 -0.5" width="2" height="2"
          material="color: red; opacity: 0; transparent: true; shader: flat; depthTest: false; depthWrite: false"
          visible="true"></a-plane>

        <!-- Collision/contact HUD text -->
        <a-entity id="contactText" position="0 0.05 -1"
          text="value: ; align: center; width: 2.2; color: #FFFFFF; wrapCount: 28" visible="false">
        </a-entity>

        <!-- ==================== TOP HUD AREA ==================== -->
        <!-- Score Panel - Top Left -->
        <a-entity id="scorePanel" position="-0.55 0.45 -1.5" visible="false">
          <a-rounded position="0 0 0.001" width="0.4" height="0.18" radius="0.025" color="#1a1a2e"
            opacity="0.85"></a-rounded>
          <a-entity id="scoreText" position="0 0.04 0.002"
            text="value: 0; align: center; width: 1.5; color: #ffd93d; font: mozillavr; anchor: center"></a-entity>
          <a-entity position="0 -0.04 0.002"
            text="value: SCORE; align: center; width: 0.6; color: #888; font: mozillavr; anchor: center"></a-entity>
        </a-entity>

        <!-- Combo Panel - Top Center -->
        <a-entity id="comboPanel" position="0 0.45 -1.5" visible="false">
          <a-rounded id="comboBg" position="0 0 0.001" width="0.35" height="0.18" radius="0.025" color="#1a1a2e"
            opacity="0.85"></a-rounded>
          <a-entity id="comboText" position="0 0.04 0.002"
            text="value: 0x; align: center; width: 1.2; color: #00d4ff; font: mozillavr; anchor: center"></a-entity>
          <a-entity position="0 -0.04 0.002"
            text="value: COMBO; align: center; width: 0.6; color: #888; font: mozillavr; anchor: center"></a-entity>
        </a-entity>

        <!-- Level/XP Panel - Top Right -->
        <a-entity id="levelPanel" position="0.55 0.45 -1.5" visible="false">
          <a-rounded position="0 0 0.001" width="0.4" height="0.18" radius="0.025" color="#1a1a2e"
            opacity="0.85"></a-rounded>
          <a-entity id="levelText" position="0 0.04 0.002"
            text="value: Lv.1; align: center; width: 1.0; color: #6bcb77; font: mozillavr; anchor: center"></a-entity>
          <a-entity id="xpText" position="0 -0.04 0.002"
            text="value: 0/100 XP; align: center; width: 0.8; color: #888; font: mozillavr; anchor: center"></a-entity>
        </a-entity>

        <!-- Timer (Roda/Challenge Mode) - Below top panels -->
        <a-entity id="timerPanel" position="0 0.28 -1.5" visible="false">
          <a-rounded position="0 0 0.001" width="0.5" height="0.1" radius="0.03" color="#1a1a2e"
            opacity="0.85"></a-rounded>
          <a-entity id="timerText" position="0 0 0"
            text="value: 10s; align: center; width: 1.2; color: #ff6b6b; font: mozillavr; anchor: center"></a-entity>
        </a-entity>

        <!-- Move Title - Below timer -->
        <a-entity id="moveTitlePanel" position="0 0.18 -1.5" visible="false">
          <a-rounded position="0 0 0.001" width="0.8" height="0.08" radius="0.02" color="#1a1a2e"
            opacity="0.85"></a-rounded>
          <a-entity id="moveTitleText" position="0 0 0"
            text="value: Ginga; align: center; width: 1.4; color: #ffd93d; font: mozillavr; anchor: center"></a-entity>
        </a-entity>

        <!-- Achievement Notification - Top center popup -->
        <a-entity id="achievementPanel" position="0 0.55 -1.5" visible="false">
          <a-rounded position="0 0 0.001" width="0.8" height="0.12" radius="0.03" color="#6bcb77"
            opacity="0.95"></a-rounded>
          <a-entity position="0 0.02 0.002"
            text="value: ACHIEVEMENT; align: center; width: 0.8; color: #0d1b2a; font: mozillavr; anchor: center"></a-entity>
          <a-entity id="achievementText" position="0 -0.025 0.002"
            text="value: First Block!; align: center; width: 1.0; color: #fff; font: mozillavr; anchor: center"></a-entity>
        </a-entity>

        <!-- ==================== COMBAT FEEDBACK (CENTER) ==================== -->
        <a-entity id="combatFeedbackPanel" position="0 0.05 -1.5" visible="true">
          <!-- Background panel -->
          <a-rounded position="0 0 0.001" width="0.7" height="0.22" radius="0.03" color="#0d1b2a"
            opacity="0.9"></a-rounded>
          <!-- Status icon circle -->
          <a-circle id="statusIcon" position="0 0.04 0.002" radius="0.035"
            material="color: #00d4ff; shader: flat"></a-circle>
          <!-- Main feedback text -->
          <a-entity id="collisionText" position="0 -0.03 0.002"
            text="value: Ready; align: center; width: 1.0; color: #00d4ff; font: mozillavr; anchor: center"></a-entity>
        </a-entity>

        <!-- ==================== STATS PANEL (Bottom Left) ==================== -->
        <a-entity id="statsPanel" position="-0.5 -0.35 -1.5" visible="false">
          <a-rounded position="0 0 0.001" width="0.35" height="0.22" radius="0.025" color="#1a1a2e"
            opacity="0.85"></a-rounded>
          <!-- Hits taken -->
          <a-entity position="-0.12 0.06 0.002">
            <a-circle radius="0.018" material="color: #ff6b6b; shader: flat"></a-circle>
            <a-entity id="hitsText" position="0.07 0 0"
              text="value: 0 Hits; align: left; width: 0.7; color: #ff6b6b; font: mozillavr"></a-entity>
          </a-entity>
          <!-- Blocks -->
          <a-entity position="-0.12 0.015 0.002">
            <a-circle radius="0.018" material="color: #6bcb77; shader: flat"></a-circle>
            <a-entity id="blocksText" position="0.07 0 0"
              text="value: 0 Blocks; align: left; width: 0.7; color: #6bcb77; font: mozillavr"></a-entity>
          </a-entity>
          <!-- Best Combo -->
          <a-entity position="-0.12 -0.03 0.002">
            <a-circle radius="0.018" material="color: #00d4ff; shader: flat"></a-circle>
            <a-entity id="bestComboText" position="0.07 0 0"
              text="value: Best: 0x; align: left; width: 0.7; color: #00d4ff; font: mozillavr"></a-entity>
          </a-entity>
          <!-- Label -->
          <a-entity position="0 -0.08 0.002"
            text="value: SESSION STATS; align: center; width: 0.5; color: #888; font: mozillavr"></a-entity>
        </a-entity>

        <!-- ==================== MODE & DIFFICULTY (Bottom Right) ==================== -->
        <a-entity id="modePanel" position="0.5 -0.35 -1.5" visible="false">
          <a-rounded position="0 0 0.001" width="0.38" height="0.15" radius="0.025" color="#1a1a2e"
            opacity="0.85"></a-rounded>
          <a-entity id="modeText" position="0 0.03 0.002"
            text="value: TRAINING; align: center; width: 0.6; color: #00d4ff; font: mozillavr; anchor: center"></a-entity>
          <a-entity id="difficultyText" position="0 -0.03 0.002"
            text="value: Normal; align: center; width: 0.5; color: #ffd93d; font: mozillavr; anchor: center"></a-entity>
        </a-entity>

        <!-- ==================== INSTRUCTION TEXT (Below center) ==================== -->
        <a-entity id="instructionPanel" position="0 -0.15 -1.5" visible="false">
          <a-rounded position="0 0 0.001" width="0.9" height="0.08" radius="0.02" color="#16213e"
            opacity="0.8"></a-rounded>
          <a-entity id="instructionText" position="0 0 0.002"
            text="value: Press joystick for help; align: center; width: 1.2; color: #aaa; font: mozillavr; anchor: center"></a-entity>
        </a-entity>

        <!-- ==================== HELP SCREEN ==================== -->
        <a-entity id="helpScreen" position="0 0.1 -1.5" visible="false">
          <!-- Main background panel -->
          <a-rounded position="0 0 0.001" width="1.1" height="0.95" radius="0.04" color="#0d1b2a"
            opacity="0.95"></a-rounded>

          <!-- Header -->
          <a-rounded position="0 0.4 0.002" width="0.5" height="0.08" radius="0.02" color="#00d4ff"
            opacity="1"></a-rounded>
          <a-entity position="0 0.4 0.003"
            text="value: CONTROLS; align: center; width: 1.0; color: #0d1b2a; font: mozillavr; anchor: center"></a-entity>

          <!-- Training Controls -->
          <a-entity position="0 0.28 0.002"
            text="value: TRAINING MODE; align: center; width: 0.7; color: #ffd93d; font: mozillavr"></a-entity>
          <a-entity position="0 0.2 0.002"
            text="value: [A] Left: Offensive  [B] Left: Defensive; align: center; width: 0.9; color: #fff; font: mozillavr; wrapCount: 40"></a-entity>
          <a-entity position="0 0.12 0.002"
            text="value: [X]/[A]Right: Toggle Roda Mode; align: center; width: 0.9; color: #fff; font: mozillavr; wrapCount: 40"></a-entity>

          <!-- Study Controls -->
          <a-entity position="0 0.02 0.002"
            text="value: STUDY TOOLS; align: center; width: 0.7; color: #6bcb77; font: mozillavr"></a-entity>
          <a-entity position="0 -0.06 0.002"
            text="value: [Grip] Slow Motion  [Trigger] Rotate; align: center; width: 0.9; color: #fff; font: mozillavr; wrapCount: 40"></a-entity>

          <!-- Session Controls -->
          <a-entity position="0 -0.16 0.002"
            text="value: SESSION; align: center; width: 0.7; color: #ff6b6b; font: mozillavr"></a-entity>
          <a-entity position="0 -0.24 0.002"
            text="value: [Y] Right: End Session & See Stats; align: center; width: 0.9; color: #fff; font: mozillavr; wrapCount: 40"></a-entity>

          <!-- Divider -->
          <a-plane position="0 -0.32 0.002" width="0.9" height="0.003" color="#00d4ff" opacity="0.5"></a-plane>

          <!-- Tips -->
          <a-entity position="0 -0.38 0.002"
            text="value: Block attacks to score! Build combos!; align: center; width: 0.9; color: #888; font: mozillavr; wrapCount: 40"></a-entity>
          <a-entity position="0 -0.45 0.002"
            text="value: Press joystick to close this menu; align: center; width: 0.85; color: #888; font: mozillavr; wrapCount: 35"></a-entity>
        </a-entity>

        <!-- ==================== SESSION SUMMARY SCREEN ==================== -->
        <a-entity id="summaryScreen" position="0 0.1 -1.5" visible="false">
          <!-- Main background panel -->
          <a-rounded position="0 0 0.001" width="1.1" height="0.9" radius="0.04" color="#0d1b2a"
            opacity="0.95"></a-rounded>

          <!-- Header -->
          <a-rounded position="0 0.38 0.002" width="0.6" height="0.08" radius="0.02" color="#ffd93d"
            opacity="1"></a-rounded>
          <a-entity position="0 0.38 0.003"
            text="value: SESSION COMPLETE; align: center; width: 1.0; color: #0d1b2a; font: mozillavr; anchor: center"></a-entity>

          <!-- Score -->
          <a-entity position="0 0.25 0.002"
            text="value: FINAL SCORE; align: center; width: 0.7; color: #888; font: mozillavr"></a-entity>
          <a-entity id="summaryScore" position="0 0.18 0.002"
            text="value: 0; align: center; width: 2.0; color: #ffd93d; font: mozillavr; anchor: center"></a-entity>

          <!-- Stats Grid -->
          <a-entity position="-0.25 0.05 0.002"
            text="value: Blocks; align: center; width: 0.6; color: #6bcb77; font: mozillavr"></a-entity>
          <a-entity id="summaryBlocks" position="-0.25 -0.02 0.002"
            text="value: 0; align: center; width: 0.8; color: #fff; font: mozillavr"></a-entity>

          <a-entity position="0 0.05 0.002"
            text="value: Best Combo; align: center; width: 0.6; color: #00d4ff; font: mozillavr"></a-entity>
          <a-entity id="summaryBestCombo" position="0 -0.02 0.002"
            text="value: 0x; align: center; width: 0.8; color: #fff; font: mozillavr"></a-entity>

          <a-entity position="0.25 0.05 0.002"
            text="value: Hits Taken; align: center; width: 0.6; color: #ff6b6b; font: mozillavr"></a-entity>
          <a-entity id="summaryHits" position="0.25 -0.02 0.002"
            text="value: 0; align: center; width: 0.8; color: #fff; font: mozillavr"></a-entity>

          <!-- Divider -->
          <a-plane position="0 -0.1 0.002" width="0.9" height="0.003" color="#ffd93d" opacity="0.5"></a-plane>

          <!-- XP Earned -->
          <a-entity position="0 -0.18 0.002"
            text="value: XP EARNED; align: center; width: 0.6; color: #888; font: mozillavr"></a-entity>
          <a-entity id="summaryXP" position="0 -0.24 0.002"
            text="value: +0 XP; align: center; width: 1.0; color: #6bcb77; font: mozillavr; anchor: center"></a-entity>

          <!-- Level Progress -->
          <a-entity id="summaryLevel" position="0 -0.32 0.002"
            text="value: Level 1; align: center; width: 0.8; color: #00d4ff; font: mozillavr"></a-entity>

          <!-- Continue button -->
          <a-rounded position="0 -0.42 0.002" width="0.5" height="0.08" radius="0.02" color="#6bcb77"
            opacity="1"></a-rounded>
          <a-entity position="0 -0.42 0.003"
            text="value: Press [B] Continue; align: center; width: 0.8; color: #0d1b2a; font: mozillavr; anchor: center"></a-entity>
        </a-entity>

        <!-- ==================== WELCOME SCREEN ==================== -->
        <a-entity id="welcomeScreen" position="0 0.1 -1.5" visible="true">
          <!-- Main background panel -->
          <a-rounded position="0 0 0.001" width="1.1" height="0.85" radius="0.04" color="#0d1b2a"
            opacity="0.95"></a-rounded>

          <!-- Title bar -->
          <a-rounded position="0 0.35 0.002" width="0.9" height="0.1" radius="0.025" color="#ffd93d"
            opacity="1"></a-rounded>
          <a-entity position="0 0.35 0.003"
            text="value: CAPOEIRA VR TRAINER; align: center; width: 1.2; color: #0d1b2a; font: mozillavr; anchor: center"></a-entity>

          <!-- Player Level -->
          <a-entity id="welcomeLevelText" position="0 0.22 0.002"
            text="value: Level 1 - Iniciante; align: center; width: 0.9; color: #6bcb77; font: mozillavr"></a-entity>
          <a-entity id="welcomeXPText" position="0 0.15 0.002"
            text="value: 0/100 XP to next level; align: center; width: 0.8; color: #888; font: mozillavr"></a-entity>

          <!-- Divider -->
          <a-plane position="0 0.08 0.002" width="0.8" height="0.003" color="#ffd93d" opacity="0.5"></a-plane>

          <!-- Difficulty Selection -->
          <a-entity position="0 0.01 0.002"
            text="value: SELECT DIFFICULTY; align: center; width: 0.7; color: #00d4ff; font: mozillavr"></a-entity>

          <!-- Difficulty Options -->
          <a-entity id="diffEasy" position="-0.3 -0.08 0.002">
            <a-rounded position="0 0 0" width="0.25" height="0.08" radius="0.015" color="#1a1a2e"
              opacity="0.9"></a-rounded>
            <a-entity position="0 0 0.001"
              text="value: EASY; align: center; width: 0.5; color: #6bcb77; font: mozillavr; anchor: center"></a-entity>
          </a-entity>
          <a-entity id="diffNormal" position="0 -0.08 0.002">
            <a-rounded position="0 0 0" width="0.25" height="0.08" radius="0.015" color="#ffd93d"
              opacity="1"></a-rounded>
            <a-entity position="0 0 0.001"
              text="value: NORMAL; align: center; width: 0.5; color: #0d1b2a; font: mozillavr; anchor: center"></a-entity>
          </a-entity>
          <a-entity id="diffHard" position="0.3 -0.08 0.002">
            <a-rounded position="0 0 0" width="0.25" height="0.08" radius="0.015" color="#1a1a2e"
              opacity="0.9"></a-rounded>
            <a-entity position="0 0 0.001"
              text="value: HARD; align: center; width: 0.5; color: #ff6b6b; font: mozillavr; anchor: center"></a-entity>
          </a-entity>

          <a-entity position="0 -0.16 0.002"
            text="value: [A] Easy  [X] Normal  [Y] Hard; align: center; width: 0.85; color: #888; font: mozillavr"></a-entity>

          <!-- Divider -->
          <a-plane position="0 -0.22 0.002" width="0.8" height="0.003" color="#ffd93d" opacity="0.5"></a-plane>

          <!-- High Score -->
          <a-entity position="0 -0.28 0.002"
            text="value: HIGH SCORE; align: center; width: 0.5; color: #888; font: mozillavr"></a-entity>
          <a-entity id="welcomeHighScore" position="0 -0.34 0.002"
            text="value: 0; align: center; width: 1.2; color: #ffd93d; font: mozillavr; anchor: center"></a-entity>

          <!-- Start button indicator -->
          <a-rounded position="0 -0.43 0.002" width="0.55" height="0.08" radius="0.02" color="#6bcb77"
            opacity="1"></a-rounded>
          <a-entity position="0 -0.43 0.003"
            text="value: Press [B] to Start; align: center; width: 0.85; color: #0d1b2a; font: mozillavr; anchor: center"></a-entity>
        </a-entity>
      </a-entity>
    </a-entity>

    <a-entity id="modelContainer">
      <a-gltf-model id="model" src="#opponent" scale="0.9 0.9 0.9" position="0 0 -2" rotation="0 0 0"
        clip-player="idle: ginga" hit-detect>
      </a-gltf-model>
    </a-entity>

    <!-- Floor (visual only; physics removed) -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" color="#7BC8A4"
      opacity="0.3"></a-plane>

    <!-- Player guard points read by hit-detect (no physics bodies) -->
    <a-entity id="playerHead" follow-camera data-body-part="head"
      geometry="primitive: sphere; radius: 0.15"
      material="color: blue; opacity: 0.3; transparent: true" visible="false"></a-entity>

    <a-entity id="leftHand" meta-touch-controls="hand: left" data-body-part="leftHand">
      <a-sphere radius="0.08" material="color: green; opacity: 0.3; transparent: true" visible="false"></a-sphere>
    </a-entity>
    <a-entity id="rightHand" meta-touch-controls="hand: right" data-body-part="rightHand">
      <a-sphere radius="0.08" material="color: green; opacity: 0.3; transparent: true" visible="false"></a-sphere>
    </a-entity>

    <a-entity environment="preset: japan; dressingAmount: 5"></a-entity>
    <a-entity sound="src: #audio; autoplay: true; loop: true; volume: 0.5"></a-entity>
  </a-scene>

  <script src="src/config.js"></script>
  <script src="src/systems.js"></script>
  <script src="src/game.js"></script>
  <script src="src/desktop-fallback.js"></script>
</body>

</html>ml>

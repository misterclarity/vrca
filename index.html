<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="https://glitch.com/favicon.ico" />
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.6.1/dist/aframe-extras.min.js"></script>
  <script>
    // aframe-rounded@1.0.3 predates three.js r144, which renamed
    // ShapeBufferGeometry to ShapeGeometry. A-Frame 1.8.0 bundles three r184,
    // so without this alias every <a-rounded> panel throws during init and the
    // scene never reaches its 'loaded' state — i.e. nothing renders at all.
    if (window.THREE && !window.THREE.ShapeBufferGeometry) {
      window.THREE.ShapeBufferGeometry = window.THREE.ShapeGeometry;
    }
  </script>
  <script src="https://unpkg.com/aframe-rounded@1.0.3/dist/aframe-rounded.min.js"></script>
  <!-- Local: lazy external-clip player (replaces per-move src swapping) -->
  <script src="src/clip-player.js"></script>
  <!-- Reactive opponent (Spar mode). Registered before scene init. -->
  <script src="src/opponent-ai.js"></script>
  <title>Capoeira VR Trainer</title>
  <style>
    .a-dialog-text {
      color: white;
      font-size: 24px;
    }
  </style>
</head>

<body>
  <!-- Desktop (non-VR) hint. Deliberately a one-line pill: the full key map
       lives in the in-scene controls card (H), so the flatscreen view stays
       clear. desktop-fallback.js shows/hides this. -->
  <div id="desktopHint" style="position:fixed;left:12px;bottom:12px;z-index:9999;
    font-family:system-ui,sans-serif;font-size:12px;line-height:1.4;color:#cfe3f5;
    background:rgba(13,27,42,.62);padding:6px 11px;border-radius:999px;
    display:none;pointer-events:none">
    <b style="color:#ffd93d">H</b> controls &nbsp;·&nbsp; <b>WASD</b> move &nbsp;·&nbsp; drag to look
  </div>

  <!-- keyboard-shortcuts enterVR is off because A-Frame binds it to F, which is
       the Spar-mode key here; pressing F otherwise threw the page into
       fullscreen/VR mid-session. Escape still exits VR. The headset button from
       vr-mode-ui remains the way in. -->
  <!-- multiviewStereo renders both eyes in one pass. The HUD is a few dozen
       separate text/panel draw calls, all of which would otherwise be
       submitted twice per frame on a headset. A-Frame ignores it where the
       OVR_multiview2 extension is missing; drop the attribute to disable. -->
  <!-- hand-tracking has to be requested explicitly; setting optionalFeatures
       replaces A-Frame's default list, so bounded-floor is repeated here. -->
  <a-scene vr-mode-ui="enabled: true" keyboard-shortcuts="enterVR: false"
    webxr="optionalFeatures: bounded-floor, hand-tracking"
    renderer="multiviewStereo: true" desktop-fallback roda-clock>
    <a-assets>
      <!-- Textured opponent mesh (loaded once); animations are lazy external clips. -->
      <a-asset-item id="opponent" src="assets/opponent.glb"></a-asset-item>
      <audio id="audio" src="assets/Luna.ogg"></audio>
    </a-assets>

    <a-entity id="cameraRig" position="0 0 0">
      <!-- The y=1.6 offset is for the flatscreen view only. A-Frame requests a
           local-floor reference space, so in VR the headset already reports eye
           height from the real floor and this offset would stack on top of it,
           putting the viewpoint about 1.6 m too high. vr-floor-camera zeroes it
           on enter-vr and restores it on exit, which also makes seated and
           standing play work without any manual calibration. -->
      <a-entity id="camera" camera="active: true" look-controls wasd-controls="enabled:true;" position="0 1.6 0"
        vr-floor-camera>
        <!-- Screen flash overlay for hit feedback. Deliberately outside hudRoot:
             it should cover the view instantly and not lag behind the head. -->
        <a-plane id="screenFlash" position="0 0 -0.5" width="2" height="2"
          material="color: red; opacity: 0; transparent: true; shader: flat; depthTest: false; depthWrite: false"
          visible="true"></a-plane>

        <!-- Everything below is the HUD proper.
             hud-overlay draws it above the world so the opponent's limbs can't
             poke through the panels. lazy-follow lets it trail the head instead
             of being welded to it: rigidly head-locked UI is uncomfortable over
             a long session, so the HUD holds still for small movements and
             eases back to centre once you turn past the dead zone. -->
        <a-entity id="hudRoot" hud-overlay lazy-follow>

        <!-- ==================== TOP STATUS BAR ====================
             Score / combo / level used to be three separate boxes eating the
             upper third of the view. They are now one slim, low-opacity strip
             pushed to the top edge so the opponent stays unobstructed. -->
        <!-- Sizing note for everything head-locked at 1.5 m: Quest 2 resolves
             roughly 20 px per degree, so text needs a character width of about
             0.026 m (~1deg) to read cleanly. width / wrapCount IS the character
             width, so wrapCount is set explicitly rather than left at A-Frame's
             default of 40. The old "SCORE"/"COMBO"/XP captions came out at
             0.4deg (~8 px) — illegible smears — and are dropped rather than
             enlarged: colour and the x / Lv. affixes already say which is which,
             and fewer words means the numbers can be bigger in the same space. -->
        <a-entity id="topBar" position="0 0.46 -1.5" visible="false">
          <a-rounded position="-0.5 -0.045 0.001" width="1.0" height="0.09" radius="0.02" color="#0d1b2a"
            opacity="0.5"></a-rounded>

          <a-entity id="scorePanel" position="-0.30 0 0.002">
            <a-entity id="scoreText" position="0 0 0"
              text="value: 0; align: center; width: 0.9; wrapCount: 30; color: #ffd93d; font: assets/fonts/capoeira-sdf.json; anchor: center"></a-entity>
          </a-entity>

          <!-- comboBg tints as the combo climbs -->
          <a-entity id="comboPanel" position="0 0 0.002">
            <a-rounded id="comboBg" position="-0.10 -0.037 -0.001" width="0.20" height="0.074" radius="0.014"
              color="#1a1a2e" opacity="0.0"></a-rounded>
            <a-entity id="comboText" position="0 0 0"
              text="value: 0x; align: center; width: 0.8; wrapCount: 26; color: #00d4ff; font: assets/fonts/capoeira-sdf.json; anchor: center"></a-entity>
          </a-entity>

          <a-entity id="levelPanel" position="0.30 0 0.002">
            <a-entity id="levelText" position="0 0 0"
              text="value: Lv.1; align: center; width: 0.7; wrapCount: 23; color: #6bcb77; font: assets/fonts/capoeira-sdf.json; anchor: center"></a-entity>
          </a-entity>
        </a-entity>

        <!-- Move title + Roda timer, sharing one line just under the status bar -->
        <a-entity id="moveTitlePanel" position="0 0.35 -1.5" visible="false">
          <a-entity id="moveTitleText" position="0 0 0"
            text="value: Ginga; align: center; width: 1.1; wrapCount: 36; color: #ffd93d; font: assets/fonts/capoeira-sdf.json; anchor: center"></a-entity>
        </a-entity>

        <a-entity id="timerPanel" position="0 0.26 -1.5" visible="false">
          <a-entity id="timerText" position="0 0 0"
            text="value: 10s; align: center; width: 0.8; wrapCount: 26; color: #ffd93d; font: assets/fonts/capoeira-sdf.json; anchor: center"></a-entity>
        </a-entity>

        <!-- Achievement toast - top center, above the status bar -->
        <a-entity id="achievementPanel" position="0 0.6 -1.5" visible="false">
          <a-rounded position="-0.45 -0.05 0.001" width="0.9" height="0.1" radius="0.025" color="#6bcb77"
            opacity="0.92"></a-rounded>
          <a-entity id="achievementText" position="0 0 0.002"
            text="value: First Block!; align: center; width: 0.9; wrapCount: 30; color: #0d1b2a; font: assets/fonts/capoeira-sdf.json; anchor: center"></a-entity>
        </a-entity>

        <!-- ==================== COMBAT FEEDBACK ====================
             No panel background any more: hit/block feedback is bare floating
             text that fades out, so nothing sits permanently over the opponent
             at eye level. -->
        <a-entity id="combatFeedbackPanel" position="0 -0.28 -1.5" visible="false">
          <a-rounded position="-0.32 -0.042 -0.001" width="0.64" height="0.084" radius="0.016"
            color="#0d1b2a" opacity="0.42"></a-rounded>
          <a-circle id="statusIcon" position="-0.28 0.004 0" radius="0.012"
            material="color: #00d4ff; shader: flat; transparent: true; opacity: 0"></a-circle>
          <a-entity id="collisionText" position="0 0 0"
            text="value: ; align: center; width: 0.85; wrapCount: 26; color: #00d4ff; font: assets/fonts/capoeira-sdf.json; anchor: center; opacity: 1"></a-entity>
        </a-entity>

        <!-- Coach line: one short, self-dismissing hint. Replaces the old
             always-on "Press joystick for help" instruction panel. -->
        <a-entity id="instructionPanel" position="0 -0.38 -1.5" visible="false">
          <a-rounded position="-0.52 -0.042 -0.001" width="1.04" height="0.084" radius="0.016"
            color="#0d1b2a" opacity="0.42"></a-rounded>
          <a-entity id="instructionText" position="0 0 0"
            text="value: ; align: center; width: 0.95; wrapCount: 34; color: #9fb3c8; font: assets/fonts/capoeira-sdf.json; anchor: center"></a-entity>
        </a-entity>

        <!-- Session stats - bottom left, dimmed to stay peripheral -->
        <a-entity id="statsPanel" position="-0.7 -0.45 -1.5" visible="false">
          <a-rounded position="-0.15 -0.085 -0.001" width="0.32" height="0.17" radius="0.018"
            color="#0d1b2a" opacity="0.38"></a-rounded>
          <a-entity position="-0.11 0.045 0">
            <a-circle radius="0.012" material="color: #ff6b6b; shader: flat"></a-circle>
            <a-entity id="hitsText" position="0.035 0 0"
              text="value: 0 Hits; align: left; anchor: left; width: 0.5; wrapCount: 20; color: #ff8f8f; font: assets/fonts/capoeira-sdf.json; opacity: 0.8"></a-entity>
          </a-entity>
          <a-entity position="-0.11 0 0">
            <a-circle radius="0.012" material="color: #6bcb77; shader: flat"></a-circle>
            <a-entity id="blocksText" position="0.035 0 0"
              text="value: 0 Blocks; align: left; anchor: left; width: 0.5; wrapCount: 20; color: #8fdc99; font: assets/fonts/capoeira-sdf.json; opacity: 0.8"></a-entity>
          </a-entity>
          <a-entity position="-0.11 -0.045 0">
            <a-circle radius="0.012" material="color: #00d4ff; shader: flat"></a-circle>
            <a-entity id="bestComboText" position="0.035 0 0"
              text="value: Best 0x; align: left; anchor: left; width: 0.5; wrapCount: 20; color: #7fe3ff; font: assets/fonts/capoeira-sdf.json; opacity: 0.8"></a-entity>
          </a-entity>
        </a-entity>

        <!-- Mode + difficulty - bottom right, dimmed -->
        <a-entity id="modePanel" position="0.7 -0.45 -1.5" visible="false">
          <a-rounded position="-0.14 -0.07 -0.001" width="0.28" height="0.14" radius="0.018"
            color="#0d1b2a" opacity="0.38"></a-rounded>
          <a-entity id="modeText" position="0 0.028 0"
            text="value: TRAINING; align: center; width: 0.55; wrapCount: 20; color: #00d4ff; font: assets/fonts/capoeira-sdf.json; anchor: center; opacity: 0.9"></a-entity>
          <a-entity id="difficultyText" position="0 -0.032 0"
            text="value: Normal; align: center; width: 0.42; wrapCount: 16; color: #a99a55; font: assets/fonts/capoeira-sdf.json; anchor: center; opacity: 0.85"></a-entity>
        </a-entity>

        <!-- ==================== SESSION SUMMARY SCREEN ==================== -->
        <a-entity id="summaryScreen" position="0 0.1 -1.5" visible="false">
          <a-rounded position="-0.55 -0.45 0.001" width="1.1" height="0.9" radius="0.04" color="#0d1b2a"
            opacity="0.95"></a-rounded>

          <a-rounded position="-0.3 0.34 0.002" width="0.6" height="0.08" radius="0.02" color="#ffd93d"
            opacity="1"></a-rounded>
          <a-entity position="0 0.38 0.003"
            text="value: SESSION COMPLETE; align: center; wrapCount: 32; width: 1.0; color: #0d1b2a; font: assets/fonts/capoeira-sdf.json; anchor: center"></a-entity>

          <a-entity position="0 0.25 0.002"
            text="value: FINAL SCORE; align: center; wrapCount: 24; width: 0.7; color: #888; font: assets/fonts/capoeira-sdf.json; anchor: center"></a-entity>
          <a-entity id="summaryScore" position="0 0.18 0.002"
            text="value: 0; align: center; wrapCount: 30; width: 2.0; color: #ffd93d; font: assets/fonts/capoeira-sdf.json; anchor: center"></a-entity>

          <a-entity position="-0.25 0.05 0.002"
            text="value: Blocks; align: center; wrapCount: 22; width: 0.6; color: #6bcb77; font: assets/fonts/capoeira-sdf.json; anchor: center"></a-entity>
          <a-entity id="summaryBlocks" position="-0.25 -0.02 0.002"
            text="value: 0; align: center; wrapCount: 26; width: 0.8; color: #fff; font: assets/fonts/capoeira-sdf.json; anchor: center"></a-entity>

          <a-entity position="0 0.05 0.002"
            text="value: Best Combo; align: center; wrapCount: 26; width: 0.6; color: #00d4ff; font: assets/fonts/capoeira-sdf.json; anchor: center"></a-entity>
          <a-entity id="summaryBestCombo" position="0 -0.02 0.002"
            text="value: 0x; align: center; wrapCount: 26; width: 0.8; color: #fff; font: assets/fonts/capoeira-sdf.json; anchor: center"></a-entity>

          <a-entity position="0.25 0.05 0.002"
            text="value: Hits Taken; align: center; wrapCount: 26; width: 0.6; color: #ff6b6b; font: assets/fonts/capoeira-sdf.json; anchor: center"></a-entity>
          <a-entity id="summaryHits" position="0.25 -0.02 0.002"
            text="value: 0; align: center; wrapCount: 26; width: 0.8; color: #fff; font: assets/fonts/capoeira-sdf.json; anchor: center"></a-entity>

          <a-plane position="0 -0.1 0.002" width="0.9" height="0.003" material="shader: flat; color: #ffd93d; opacity: 0.5"></a-plane>

          <a-entity position="0 -0.18 0.002"
            text="value: XP EARNED; align: center; wrapCount: 22; width: 0.6; color: #888; font: assets/fonts/capoeira-sdf.json; anchor: center"></a-entity>
          <a-entity id="summaryXP" position="0 -0.24 0.002"
            text="value: +0 XP; align: center; wrapCount: 30; width: 1.0; color: #6bcb77; font: assets/fonts/capoeira-sdf.json; anchor: center"></a-entity>

          <a-entity id="summaryLevel" position="0 -0.32 0.002"
            text="value: Level 1; align: center; wrapCount: 26; width: 0.8; color: #00d4ff; font: assets/fonts/capoeira-sdf.json; anchor: center"></a-entity>

          <a-rounded position="-0.25 -0.46 0.002" width="0.5" height="0.08" radius="0.02" color="#6bcb77"
            opacity="1"></a-rounded>
          <a-entity id="summaryContinueHint" position="0 -0.42 0.003"
            text="value: [A] Continue; align: center; wrapCount: 28; width: 0.8; color: #0d1b2a; font: assets/fonts/capoeira-sdf.json; anchor: center"></a-entity>
        </a-entity>

        <!-- ==================== WELCOME SCREEN ==================== -->
        <a-entity id="welcomeScreen" position="0 0.1 -1.5" visible="true">
          <a-rounded position="-0.55 -0.52 0.001" width="1.1" height="0.95" radius="0.04" color="#0d1b2a"
            opacity="0.95"></a-rounded>

          <a-rounded position="-0.45 0.3 0.002" width="0.9" height="0.1" radius="0.025" color="#ffd93d"
            opacity="1"></a-rounded>
          <a-entity position="0 0.35 0.003"
            text="value: CAPOEIRA VR TRAINER; align: center; wrapCount: 40; width: 1.2; color: #0d1b2a; font: assets/fonts/capoeira-sdf.json; anchor: center"></a-entity>

          <a-entity id="welcomeLevelText" position="0 0.22 0.002"
            text="value: Level 1 - Iniciante; align: center; wrapCount: 30; width: 0.9; color: #6bcb77; font: assets/fonts/capoeira-sdf.json; anchor: center"></a-entity>
          <a-entity id="welcomeXPText" position="0 0.15 0.002"
            text="value: 0/100 XP to next level; align: center; wrapCount: 30; width: 0.8; color: #888; font: assets/fonts/capoeira-sdf.json; anchor: center"></a-entity>

          <a-plane position="0 0.08 0.002" width="0.8" height="0.003" material="shader: flat; color: #ffd93d; opacity: 0.5"></a-plane>

          <a-entity position="0 0.01 0.002"
            text="value: DIFFICULTY; align: center; wrapCount: 22; width: 0.6; color: #00d4ff; font: assets/fonts/capoeira-sdf.json; anchor: center"></a-entity>

          <a-entity id="diffEasy" position="-0.3 -0.08 0.002">
            <a-rounded position="-0.125 -0.04 0" width="0.25" height="0.08" radius="0.015" color="#1a1a2e"
              opacity="0.9"></a-rounded>
            <a-entity position="0 0 0.001"
              text="value: EASY; align: center; wrapCount: 18; width: 0.5; color: #6bcb77; font: assets/fonts/capoeira-sdf.json; anchor: center"></a-entity>
          </a-entity>
          <a-entity id="diffNormal" position="0 -0.08 0.002">
            <a-rounded position="-0.125 -0.04 0" width="0.25" height="0.08" radius="0.015" color="#ffd93d"
              opacity="1"></a-rounded>
            <a-entity position="0 0 0.001"
              text="value: NORMAL; align: center; wrapCount: 18; width: 0.5; color: #0d1b2a; font: assets/fonts/capoeira-sdf.json; anchor: center"></a-entity>
          </a-entity>
          <a-entity id="diffHard" position="0.3 -0.08 0.002">
            <a-rounded position="-0.125 -0.04 0" width="0.25" height="0.08" radius="0.015" color="#1a1a2e"
              opacity="0.9"></a-rounded>
            <a-entity position="0 0 0.001"
              text="value: HARD; align: center; wrapCount: 18; width: 0.5; color: #ff6b6b; font: assets/fonts/capoeira-sdf.json; anchor: center"></a-entity>
          </a-entity>

          <a-entity id="welcomeDiffHint" position="0 -0.16 0.002"
            text="value: Thumbstick left / right to choose; align: center; wrapCount: 30; width: 0.8; color: #888; font: assets/fonts/capoeira-sdf.json; anchor: center"></a-entity>

          <a-plane position="0 -0.22 0.002" width="0.8" height="0.003" material="shader: flat; color: #ffd93d; opacity: 0.5"></a-plane>

          <a-entity position="0 -0.28 0.002"
            text="value: HIGH SCORE; align: center; wrapCount: 18; width: 0.5; color: #888; font: assets/fonts/capoeira-sdf.json; anchor: center"></a-entity>
          <a-entity id="welcomeHighScore" position="0 -0.335 0.002"
            text="value: 0; align: center; wrapCount: 30; width: 1.0; color: #ffd93d; font: assets/fonts/capoeira-sdf.json; anchor: center"></a-entity>

          <a-rounded position="-0.275 -0.47 0.002" width="0.55" height="0.08" radius="0.02" color="#6bcb77"
            opacity="1"></a-rounded>
          <a-entity id="welcomeStartHint" position="0 -0.43 0.003"
            text="value: Press [A] to Start; align: center; wrapCount: 28; width: 0.85; color: #0d1b2a; font: assets/fonts/capoeira-sdf.json; anchor: center"></a-entity>
        </a-entity>
        </a-entity><!-- /hudRoot -->
      </a-entity>
    </a-entity>

    <a-entity id="modelContainer">
      <a-gltf-model id="model" src="#opponent" scale="0.9 0.9 0.9" position="0 0 -2" rotation="0 0 0"
        clip-player="idle: ginga" hit-detect opponent-ai>
      </a-gltf-model>
    </a-entity>

    <!-- No floor plane here: the environment preset already draws ground at
         y=0, and a second coplanar surface z-fights with it (visible flicker
         as the camera moves). Nothing reads this entity — collision uses bone
         distance checks, not physics. -->

    <!-- Player guard points read by hit-detect (no physics bodies) -->
    <a-entity id="playerHead" follow-camera data-body-part="head"
      geometry="primitive: sphere; radius: 0.15"
      material="color: blue; opacity: 0.3; transparent: true" visible="false"></a-entity>

    <!-- Input sources. Both components sit on the same entity deliberately —
         that is A-Frame's documented way to support controllers and bare hands
         in one app, and it switches automatically as the player picks a
         controller up or puts it down. These entities carry no guard data:
         hand-tracking-controls pins its entity's transform to the origin every
         frame and reports joints separately, so anything that needs a real
         hand position reads the guard points below instead. -->
    <a-entity id="leftHand" meta-touch-controls="hand: left"
      hand-tracking-controls="hand: left"></a-entity>
    <a-entity id="rightHand" meta-touch-controls="hand: right"
      hand-tracking-controls="hand: right"></a-entity>

    <!-- Guard points: what actually blocks. Each follows whichever input is
         live — the controller entity, or the tracked wrist when the player is
         using bare hands — so blocking works identically either way. -->
    <a-entity id="leftGuard" guard-point="hand: left" data-body-part="leftHand">
      <a-sphere radius="0.08" material="color: green; opacity: 0.3; transparent: true" visible="false"></a-sphere>

      <!-- ==================== CONTROLS CARD ====================
           Wrist-mounted, not head-locked: raise your left hand to read it and
           it never covers the opponent or the HUD. Rows are generated from the
           CONTROLS table in config.js so the labels can never go stale, and
           they switch between Quest, hand-tracking and keyboard names
           automatically. Parented to the guard rather than the controller so
           it stays on the wrist in hand-tracking mode too. -->
      <a-entity id="controlsCard" position="0.02 0.15 0.02" visible="false" billboard-to-camera>
        <a-rounded id="controlsCardBg" position="-0.15 -0.1 0" width="0.3" height="0.2" radius="0.012"
          color="#0d1b2a" opacity="0.9"></a-rounded>
        <a-entity id="controlsCardTitle" position="0 0.06 0.002"
          text="value: CONTROLS; align: center; width: 0.34; wrapCount: 26; color: #00d4ff; font: assets/fonts/capoeira-sdf.json; anchor: center"></a-entity>
        <a-entity id="controlsCardRows" position="0 0 0.002"></a-entity>
        <a-entity id="controlsCardFooter" position="0 -0.14 0.002"
          text="value: ; align: center; width: 0.26; wrapCount: 30; color: #5d7a91; font: assets/fonts/capoeira-sdf.json; anchor: center"></a-entity>
      </a-entity>
    </a-entity>
    <a-entity id="rightGuard" guard-point="hand: right" data-body-part="rightHand">
      <a-sphere radius="0.08" material="color: green; opacity: 0.3; transparent: true" visible="false"></a-sphere>
    </a-entity>

    <a-entity environment="preset: japan; dressingAmount: 5"></a-entity>
    <a-entity sound="src: #audio; autoplay: true; loop: true; volume: 0.5"></a-entity>
  </a-scene>

  <script src="src/config.js"></script>
  <script src="src/systems.js"></script>
  <script src="src/game.js"></script>
  <script src="src/desktop-fallback.js"></script>
</body>

</html>

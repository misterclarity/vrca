<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="https://glitch.com/favicon.ico" />
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.6.1/dist/aframe-extras.min.js"></script>
  <script
    src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.4/dist/aframe-physics-system.min.js"></script>
  <script src="https://unpkg.com/aframe-rounded@1.0.3/dist/aframe-rounded.min.js"></script>
  <title>Capoeira VR Trainer</title>
  <style>
    .a-dialog-text {
      color: white;
      font-size: 24px;
    }
  </style>
</head>

<body>
  <a-scene vr-mode-ui="enabled: true" physics="debug: true; gravity: 0 -9.8 0;">
    <a-assets>
      <a-asset-item id="ginga1" src="assets/Ginga1.glb"></a-asset-item>
      <a-asset-item id="macaco" src="assets/Macaco%20Side.glb"></a-asset-item>
      <a-asset-item id="troca" src="assets/Troca.glb"></a-asset-item>
      <a-asset-item id="martelo3" src="assets/Martelo3.glb"></a-asset-item>
      <a-asset-item id="ginga&compasso" src="assets/ginga%26compasso.glb"></a-asset-item>
      <audio id="audio" src="assets/Luna.ogg"></audio>
    </a-assets>

    <a-entity id="cameraRig" position="0 0 0">
      <a-entity id="camera" camera look-controls wasd-controls="enabled:true;">
        <!-- Screen flash overlay for hit feedback -->
        <a-plane id="screenFlash" position="0 0 -0.5" width="2" height="2"
          material="color: red; opacity: 0; transparent: true; shader: flat; depthTest: false; depthWrite: false"
          visible="true"></a-plane>

        <!-- Collision/contact HUD text -->
        <a-entity id="contactText" position="0 0.05 -1"
          text="value: ; align: center; width: 2.2; color: #FFFFFF; wrapCount: 28" visible="false">
        </a-entity>

        <!-- ==================== TOP HUD AREA ==================== -->
        <!-- Score Panel - Top Left -->
        <a-entity id="scorePanel" position="-0.55 0.45 -1.5" visible="false">
          <a-rounded position="0 0 0.001" width="0.4" height="0.18" radius="0.025" color="#1a1a2e"
            opacity="0.85"></a-rounded>
          <a-entity id="scoreText" position="0 0.04 0.002"
            text="value: 0; align: center; width: 1.5; color: #ffd93d; font: mozillavr; anchor: center"></a-entity>
          <a-entity position="0 -0.04 0.002"
            text="value: SCORE; align: center; width: 0.6; color: #888; font: mozillavr; anchor: center"></a-entity>
        </a-entity>

        <!-- Combo Panel - Top Center -->
        <a-entity id="comboPanel" position="0 0.45 -1.5" visible="false">
          <a-rounded id="comboBg" position="0 0 0.001" width="0.35" height="0.18" radius="0.025" color="#1a1a2e"
            opacity="0.85"></a-rounded>
          <a-entity id="comboText" position="0 0.04 0.002"
            text="value: 0x; align: center; width: 1.2; color: #00d4ff; font: mozillavr; anchor: center"></a-entity>
          <a-entity position="0 -0.04 0.002"
            text="value: COMBO; align: center; width: 0.6; color: #888; font: mozillavr; anchor: center"></a-entity>
        </a-entity>

        <!-- Level/XP Panel - Top Right -->
        <a-entity id="levelPanel" position="0.55 0.45 -1.5" visible="false">
          <a-rounded position="0 0 0.001" width="0.4" height="0.18" radius="0.025" color="#1a1a2e"
            opacity="0.85"></a-rounded>
          <a-entity id="levelText" position="0 0.04 0.002"
            text="value: Lv.1; align: center; width: 1.0; color: #6bcb77; font: mozillavr; anchor: center"></a-entity>
          <a-entity id="xpText" position="0 -0.04 0.002"
            text="value: 0/100 XP; align: center; width: 0.8; color: #888; font: mozillavr; anchor: center"></a-entity>
        </a-entity>

        <!-- Timer (Roda/Challenge Mode) - Below top panels -->
        <a-entity id="timerPanel" position="0 0.28 -1.5" visible="false">
          <a-rounded position="0 0 0.001" width="0.5" height="0.1" radius="0.03" color="#1a1a2e"
            opacity="0.85"></a-rounded>
          <a-entity id="timerText" position="0 0 0"
            text="value: 10s; align: center; width: 1.2; color: #ff6b6b; font: mozillavr; anchor: center"></a-entity>
        </a-entity>

        <!-- Move Title - Below timer -->
        <a-entity id="moveTitlePanel" position="0 0.18 -1.5" visible="false">
          <a-rounded position="0 0 0.001" width="0.8" height="0.08" radius="0.02" color="#1a1a2e"
            opacity="0.85"></a-rounded>
          <a-entity id="moveTitleText" position="0 0 0"
            text="value: Ginga; align: center; width: 1.4; color: #ffd93d; font: mozillavr; anchor: center"></a-entity>
        </a-entity>

        <!-- Achievement Notification - Top center popup -->
        <a-entity id="achievementPanel" position="0 0.55 -1.5" visible="false">
          <a-rounded position="0 0 0.001" width="0.8" height="0.12" radius="0.03" color="#6bcb77"
            opacity="0.95"></a-rounded>
          <a-entity position="0 0.02 0.002"
            text="value: ACHIEVEMENT; align: center; width: 0.8; color: #0d1b2a; font: mozillavr; anchor: center"></a-entity>
          <a-entity id="achievementText" position="0 -0.025 0.002"
            text="value: First Block!; align: center; width: 1.0; color: #fff; font: mozillavr; anchor: center"></a-entity>
        </a-entity>

        <!-- ==================== COMBAT FEEDBACK (CENTER) ==================== -->
        <a-entity id="combatFeedbackPanel" position="0 0.05 -1.5" visible="true">
          <!-- Background panel -->
          <a-rounded position="0 0 0.001" width="0.7" height="0.22" radius="0.03" color="#0d1b2a"
            opacity="0.9"></a-rounded>
          <!-- Status icon circle -->
          <a-circle id="statusIcon" position="0 0.04 0.002" radius="0.035"
            material="color: #00d4ff; shader: flat"></a-circle>
          <!-- Main feedback text -->
          <a-entity id="collisionText" position="0 -0.03 0.002"
            text="value: Ready; align: center; width: 1.0; color: #00d4ff; font: mozillavr; anchor: center"></a-entity>
        </a-entity>

        <!-- ==================== STATS PANEL (Bottom Left) ==================== -->
        <a-entity id="statsPanel" position="-0.5 -0.35 -1.5" visible="false">
          <a-rounded position="0 0 0.001" width="0.35" height="0.22" radius="0.025" color="#1a1a2e"
            opacity="0.85"></a-rounded>
          <!-- Hits taken -->
          <a-entity position="-0.12 0.06 0.002">
            <a-circle radius="0.018" material="color: #ff6b6b; shader: flat"></a-circle>
            <a-entity id="hitsText" position="0.07 0 0"
              text="value: 0 Hits; align: left; width: 0.7; color: #ff6b6b; font: mozillavr"></a-entity>
          </a-entity>
          <!-- Blocks -->
          <a-entity position="-0.12 0.015 0.002">
            <a-circle radius="0.018" material="color: #6bcb77; shader: flat"></a-circle>
            <a-entity id="blocksText" position="0.07 0 0"
              text="value: 0 Blocks; align: left; width: 0.7; color: #6bcb77; font: mozillavr"></a-entity>
          </a-entity>
          <!-- Best Combo -->
          <a-entity position="-0.12 -0.03 0.002">
            <a-circle radius="0.018" material="color: #00d4ff; shader: flat"></a-circle>
            <a-entity id="bestComboText" position="0.07 0 0"
              text="value: Best: 0x; align: left; width: 0.7; color: #00d4ff; font: mozillavr"></a-entity>
          </a-entity>
          <!-- Label -->
          <a-entity position="0 -0.08 0.002"
            text="value: SESSION STATS; align: center; width: 0.5; color: #888; font: mozillavr"></a-entity>
        </a-entity>

        <!-- ==================== MODE & DIFFICULTY (Bottom Right) ==================== -->
        <a-entity id="modePanel" position="0.5 -0.35 -1.5" visible="false">
          <a-rounded position="0 0 0.001" width="0.38" height="0.15" radius="0.025" color="#1a1a2e"
            opacity="0.85"></a-rounded>
          <a-entity id="modeText" position="0 0.03 0.002"
            text="value: TRAINING; align: center; width: 0.6; color: #00d4ff; font: mozillavr; anchor: center"></a-entity>
          <a-entity id="difficultyText" position="0 -0.03 0.002"
            text="value: Normal; align: center; width: 0.5; color: #ffd93d; font: mozillavr; anchor: center"></a-entity>
        </a-entity>

        <!-- ==================== INSTRUCTION TEXT (Below center) ==================== -->
        <a-entity id="instructionPanel" position="0 -0.15 -1.5" visible="false">
          <a-rounded position="0 0 0.001" width="0.9" height="0.08" radius="0.02" color="#16213e"
            opacity="0.8"></a-rounded>
          <a-entity id="instructionText" position="0 0 0.002"
            text="value: Press joystick for help; align: center; width: 1.2; color: #aaa; font: mozillavr; anchor: center"></a-entity>
        </a-entity>

        <!-- ==================== HELP SCREEN ==================== -->
        <a-entity id="helpScreen" position="0 0.1 -1.5" visible="false">
          <!-- Main background panel -->
          <a-rounded position="0 0 0.001" width="1.1" height="0.95" radius="0.04" color="#0d1b2a"
            opacity="0.95"></a-rounded>

          <!-- Header -->
          <a-rounded position="0 0.4 0.002" width="0.5" height="0.08" radius="0.02" color="#00d4ff"
            opacity="1"></a-rounded>
          <a-entity position="0 0.4 0.003"
            text="value: CONTROLS; align: center; width: 1.0; color: #0d1b2a; font: mozillavr; anchor: center"></a-entity>

          <!-- Training Controls -->
          <a-entity position="0 0.28 0.002"
            text="value: TRAINING MODE; align: center; width: 0.7; color: #ffd93d; font: mozillavr"></a-entity>
          <a-entity position="0 0.2 0.002"
            text="value: [A] Left: Offensive  [B] Left: Defensive; align: center; width: 0.9; color: #fff; font: mozillavr; wrapCount: 40"></a-entity>
          <a-entity position="0 0.12 0.002"
            text="value: [X]/[A]Right: Toggle Roda Mode; align: center; width: 0.9; color: #fff; font: mozillavr; wrapCount: 40"></a-entity>

          <!-- Study Controls -->
          <a-entity position="0 0.02 0.002"
            text="value: STUDY TOOLS; align: center; width: 0.7; color: #6bcb77; font: mozillavr"></a-entity>
          <a-entity position="0 -0.06 0.002"
            text="value: [Grip] Slow Motion  [Trigger] Rotate; align: center; width: 0.9; color: #fff; font: mozillavr; wrapCount: 40"></a-entity>

          <!-- Session Controls -->
          <a-entity position="0 -0.16 0.002"
            text="value: SESSION; align: center; width: 0.7; color: #ff6b6b; font: mozillavr"></a-entity>
          <a-entity position="0 -0.24 0.002"
            text="value: [Y] Right: End Session & See Stats; align: center; width: 0.9; color: #fff; font: mozillavr; wrapCount: 40"></a-entity>

          <!-- Divider -->
          <a-plane position="0 -0.32 0.002" width="0.9" height="0.003" color="#00d4ff" opacity="0.5"></a-plane>

          <!-- Tips -->
          <a-entity position="0 -0.38 0.002"
            text="value: Block attacks to score! Build combos!; align: center; width: 0.9; color: #888; font: mozillavr; wrapCount: 40"></a-entity>
          <a-entity position="0 -0.45 0.002"
            text="value: Press joystick to close this menu; align: center; width: 0.85; color: #888; font: mozillavr; wrapCount: 35"></a-entity>
        </a-entity>

        <!-- ==================== SESSION SUMMARY SCREEN ==================== -->
        <a-entity id="summaryScreen" position="0 0.1 -1.5" visible="false">
          <!-- Main background panel -->
          <a-rounded position="0 0 0.001" width="1.1" height="0.9" radius="0.04" color="#0d1b2a"
            opacity="0.95"></a-rounded>

          <!-- Header -->
          <a-rounded position="0 0.38 0.002" width="0.6" height="0.08" radius="0.02" color="#ffd93d"
            opacity="1"></a-rounded>
          <a-entity position="0 0.38 0.003"
            text="value: SESSION COMPLETE; align: center; width: 1.0; color: #0d1b2a; font: mozillavr; anchor: center"></a-entity>

          <!-- Score -->
          <a-entity position="0 0.25 0.002"
            text="value: FINAL SCORE; align: center; width: 0.7; color: #888; font: mozillavr"></a-entity>
          <a-entity id="summaryScore" position="0 0.18 0.002"
            text="value: 0; align: center; width: 2.0; color: #ffd93d; font: mozillavr; anchor: center"></a-entity>

          <!-- Stats Grid -->
          <a-entity position="-0.25 0.05 0.002"
            text="value: Blocks; align: center; width: 0.6; color: #6bcb77; font: mozillavr"></a-entity>
          <a-entity id="summaryBlocks" position="-0.25 -0.02 0.002"
            text="value: 0; align: center; width: 0.8; color: #fff; font: mozillavr"></a-entity>

          <a-entity position="0 0.05 0.002"
            text="value: Best Combo; align: center; width: 0.6; color: #00d4ff; font: mozillavr"></a-entity>
          <a-entity id="summaryBestCombo" position="0 -0.02 0.002"
            text="value: 0x; align: center; width: 0.8; color: #fff; font: mozillavr"></a-entity>

          <a-entity position="0.25 0.05 0.002"
            text="value: Hits Taken; align: center; width: 0.6; color: #ff6b6b; font: mozillavr"></a-entity>
          <a-entity id="summaryHits" position="0.25 -0.02 0.002"
            text="value: 0; align: center; width: 0.8; color: #fff; font: mozillavr"></a-entity>

          <!-- Divider -->
          <a-plane position="0 -0.1 0.002" width="0.9" height="0.003" color="#ffd93d" opacity="0.5"></a-plane>

          <!-- XP Earned -->
          <a-entity position="0 -0.18 0.002"
            text="value: XP EARNED; align: center; width: 0.6; color: #888; font: mozillavr"></a-entity>
          <a-entity id="summaryXP" position="0 -0.24 0.002"
            text="value: +0 XP; align: center; width: 1.0; color: #6bcb77; font: mozillavr; anchor: center"></a-entity>

          <!-- Level Progress -->
          <a-entity id="summaryLevel" position="0 -0.32 0.002"
            text="value: Level 1; align: center; width: 0.8; color: #00d4ff; font: mozillavr"></a-entity>

          <!-- Continue button -->
          <a-rounded position="0 -0.42 0.002" width="0.5" height="0.08" radius="0.02" color="#6bcb77"
            opacity="1"></a-rounded>
          <a-entity position="0 -0.42 0.003"
            text="value: Press [B] Continue; align: center; width: 0.8; color: #0d1b2a; font: mozillavr; anchor: center"></a-entity>
        </a-entity>

        <!-- ==================== WELCOME SCREEN ==================== -->
        <a-entity id="welcomeScreen" position="0 0.1 -1.5" visible="true">
          <!-- Main background panel -->
          <a-rounded position="0 0 0.001" width="1.1" height="0.85" radius="0.04" color="#0d1b2a"
            opacity="0.95"></a-rounded>

          <!-- Title bar -->
          <a-rounded position="0 0.35 0.002" width="0.9" height="0.1" radius="0.025" color="#ffd93d"
            opacity="1"></a-rounded>
          <a-entity position="0 0.35 0.003"
            text="value: CAPOEIRA VR TRAINER; align: center; width: 1.2; color: #0d1b2a; font: mozillavr; anchor: center"></a-entity>

          <!-- Player Level -->
          <a-entity id="welcomeLevelText" position="0 0.22 0.002"
            text="value: Level 1 - Iniciante; align: center; width: 0.9; color: #6bcb77; font: mozillavr"></a-entity>
          <a-entity id="welcomeXPText" position="0 0.15 0.002"
            text="value: 0/100 XP to next level; align: center; width: 0.8; color: #888; font: mozillavr"></a-entity>

          <!-- Divider -->
          <a-plane position="0 0.08 0.002" width="0.8" height="0.003" color="#ffd93d" opacity="0.5"></a-plane>

          <!-- Difficulty Selection -->
          <a-entity position="0 0.01 0.002"
            text="value: SELECT DIFFICULTY; align: center; width: 0.7; color: #00d4ff; font: mozillavr"></a-entity>

          <!-- Difficulty Options -->
          <a-entity id="diffEasy" position="-0.3 -0.08 0.002">
            <a-rounded position="0 0 0" width="0.25" height="0.08" radius="0.015" color="#1a1a2e"
              opacity="0.9"></a-rounded>
            <a-entity position="0 0 0.001"
              text="value: EASY; align: center; width: 0.5; color: #6bcb77; font: mozillavr; anchor: center"></a-entity>
          </a-entity>
          <a-entity id="diffNormal" position="0 -0.08 0.002">
            <a-rounded position="0 0 0" width="0.25" height="0.08" radius="0.015" color="#ffd93d"
              opacity="1"></a-rounded>
            <a-entity position="0 0 0.001"
              text="value: NORMAL; align: center; width: 0.5; color: #0d1b2a; font: mozillavr; anchor: center"></a-entity>
          </a-entity>
          <a-entity id="diffHard" position="0.3 -0.08 0.002">
            <a-rounded position="0 0 0" width="0.25" height="0.08" radius="0.015" color="#1a1a2e"
              opacity="0.9"></a-rounded>
            <a-entity position="0 0 0.001"
              text="value: HARD; align: center; width: 0.5; color: #ff6b6b; font: mozillavr; anchor: center"></a-entity>
          </a-entity>

          <a-entity position="0 -0.16 0.002"
            text="value: [A] Easy  [X] Normal  [Y] Hard; align: center; width: 0.85; color: #888; font: mozillavr"></a-entity>

          <!-- Divider -->
          <a-plane position="0 -0.22 0.002" width="0.8" height="0.003" color="#ffd93d" opacity="0.5"></a-plane>

          <!-- High Score -->
          <a-entity position="0 -0.28 0.002"
            text="value: HIGH SCORE; align: center; width: 0.5; color: #888; font: mozillavr"></a-entity>
          <a-entity id="welcomeHighScore" position="0 -0.34 0.002"
            text="value: 0; align: center; width: 1.2; color: #ffd93d; font: mozillavr; anchor: center"></a-entity>

          <!-- Start button indicator -->
          <a-rounded position="0 -0.43 0.002" width="0.55" height="0.08" radius="0.02" color="#6bcb77"
            opacity="1"></a-rounded>
          <a-entity position="0 -0.43 0.003"
            text="value: Press [B] to Start; align: center; width: 0.85; color: #0d1b2a; font: mozillavr; anchor: center"></a-entity>
        </a-entity>
      </a-entity>
    </a-entity>

    <a-entity id="modelContainer">
      <a-gltf-model id="model" src="#ginga1" scale="0.01 0.01 0.01" position="0 0 -2" rotation="0 0 0"
        animation-mixer="timeScale: 1" log-bones>
      </a-gltf-model>
    </a-entity>

    <!-- Floor for physics -->
    <a-plane static-body position="0 0 0" rotation="-90 0 0" width="20" height="20" color="#7BC8A4"
      opacity="0.3"></a-plane>

    <!-- Player body colliders for combat detection -->
    <a-entity id="playerHead" player-collider="bodyPart: head" geometry="primitive: sphere; radius: 0.15"
      material="color: blue; opacity: 0.3; transparent: true" visible="false"></a-entity>

    <a-entity id="leftHand" oculus-touch-controls="hand: left" player-collider="bodyPart: leftHand">
      <a-sphere radius="0.08" material="color: green; opacity: 0.3; transparent: true" visible="false"></a-sphere>
    </a-entity>
    <a-entity id="rightHand" oculus-touch-controls="hand: right" player-collider="bodyPart: rightHand">
      <a-sphere radius="0.08" material="color: green; opacity: 0.3; transparent: true" visible="false"></a-sphere>
    </a-entity>

    <a-entity environment="preset: japan; dressingAmount: 5"></a-entity>
    <a-entity sound="src: #audio; autoplay: true; loop: true; volume: 0.5"></a-entity>
  </a-scene>

  <script>
    // --- CONSTANTS ---
    const DEFAULT_RODA_TIME = 10;
    const SLOW_MOTION_SCALE = 0.4;
    const NORMAL_TIME_SCALE = 1;
    const DEFENSIVE_START_INDEX = 0;
    const OFFENSIVE_START_INDEX = 0;
    const DEFAULT_MODEL_ROTATION = 0;
    const FACING_AWAY_ROTATION = 180;

    // Welcome screen elements
    const welcomeLevelText = document.getElementById("welcomeLevelText");
    const welcomeXPText = document.getElementById("welcomeXPText");
    const welcomeHighScore = document.getElementById("welcomeHighScore");
    const diffEasy = document.getElementById("diffEasy");
    const diffNormal = document.getElementById("diffNormal");
    const diffHard = document.getElementById("diffHard");

    // --- DOM ELEMENTS ---
    const entity = document.getElementById("model");
    const instructionText = document.getElementById("instructionText");
    const instructionPanel = document.getElementById("instructionPanel");
    const helpScreen = document.getElementById("helpScreen");
    const moveTitleText = document.getElementById("moveTitleText");
    const moveTitlePanel = document.getElementById("moveTitlePanel");
    const timerText = document.getElementById("timerText");
    const timerPanel = document.getElementById("timerPanel");
    const leftHand = document.getElementById("leftHand");
    const rightHand = document.getElementById("rightHand");
    const welcomeScreen = document.getElementById("welcomeScreen");
    const statsPanel = document.getElementById("statsPanel");
    const hitsText = document.getElementById("hitsText");
    const blocksText = document.getElementById("blocksText");
    const bestComboText = document.getElementById("bestComboText");
    const modePanel = document.getElementById("modePanel");
    const modeText = document.getElementById("modeText");
    const difficultyText = document.getElementById("difficultyText");
    const statusIcon = document.getElementById("statusIcon");
    const combatFeedbackPanel = document.getElementById("combatFeedbackPanel");

    const moveData = {
      defensive: [
        { id: "#ginga1", title: "Ginga" },
        { id: "#macaco", title: "Macaco (Monkey Move)" },
        { id: "#troca", title: "Troca (Exchange)" },
      ],
      offensive: [
        { id: "#martelo3", title: "Martelo (Hammer Kick)" },
        { id: "#ginga&compasso", title: "Compasso (Compass Kick)" },
      ],
    };

    // --- STATE ---
    let state = {
      isGameStarted: false,
      currentDefensiveIndex: DEFENSIVE_START_INDEX,
      currentOffensiveIndex: OFFENSIVE_START_INDEX,
      isRodaModeActive: false,
      isChallengeMode: false,
      rodaInterval: null,
      timeLeft: DEFAULT_RODA_TIME,
      isFacingAway: false,
      isHelpVisible: false,
      currentMoveType: 'defensive',
      colliders: [], // Track dynamic colliders
      sessionStartTime: null,
      showingSummary: false
    };

    // --- DIFFICULTY SETTINGS ---
    const DIFFICULTY = {
      easy: {
        name: 'Easy',
        animationSpeed: 0.6,
        hitCooldown: 700,
        blockPoints: 15,
        hitPenalty: 3,
        comboBonus: 5,
        xpMultiplier: 0.8,
        rodaTime: 15
      },
      normal: {
        name: 'Normal',
        animationSpeed: 1.0,
        hitCooldown: 500,
        blockPoints: 25,
        hitPenalty: 5,
        comboBonus: 10,
        xpMultiplier: 1.0,
        rodaTime: 10
      },
      hard: {
        name: 'Hard',
        animationSpeed: 1.4,
        hitCooldown: 350,
        blockPoints: 40,
        hitPenalty: 10,
        comboBonus: 20,
        xpMultiplier: 1.5,
        rodaTime: 7
      }
    };

    // --- LEVEL/BELT SYSTEM ---
    const LEVELS = [
      { level: 1, name: 'Iniciante', xpRequired: 0, color: '#ffffff' },
      { level: 2, name: 'Batizado', xpRequired: 100, color: '#ffd93d' },
      { level: 3, name: 'Graduado', xpRequired: 300, color: '#ffa500' },
      { level: 4, name: 'Intermediário', xpRequired: 600, color: '#00d4ff' },
      { level: 5, name: 'Avançado', xpRequired: 1000, color: '#6bcb77' },
      { level: 6, name: 'Formado', xpRequired: 1500, color: '#9b59b6' },
      { level: 7, name: 'Formado+', xpRequired: 2200, color: '#e74c3c' },
      { level: 8, name: 'Mestre', xpRequired: 3000, color: '#1a1a2e' }
    ];

    // --- ACHIEVEMENTS ---
    const ACHIEVEMENTS = {
      firstBlock: { id: 'firstBlock', name: 'First Block!', description: 'Block your first attack', unlocked: false },
      combo5: { id: 'combo5', name: 'Combo Master', description: 'Reach a 5x combo', unlocked: false },
      combo10: { id: 'combo10', name: 'Unstoppable!', description: 'Reach a 10x combo', unlocked: false },
      blocks10: { id: 'blocks10', name: 'Defender', description: 'Block 10 attacks in one session', unlocked: false },
      blocks25: { id: 'blocks25', name: 'Iron Defense', description: 'Block 25 attacks in one session', unlocked: false },
      score500: { id: 'score500', name: 'Rising Star', description: 'Score 500 points', unlocked: false },
      score1000: { id: 'score1000', name: 'Champion', description: 'Score 1000 points', unlocked: false },
      noHits: { id: 'noHits', name: 'Untouchable', description: 'Complete a Roda round without getting hit', unlocked: false },
      level5: { id: 'level5', name: 'Dedicated', description: 'Reach Level 5', unlocked: false },
      hardMode: { id: 'hardMode', name: 'Fearless', description: 'Complete a session on Hard difficulty', unlocked: false }
    };

    // --- GAME DATA SYSTEM (localStorage) ---
    const gameData = {
      currentDifficulty: 'normal',
      totalXP: 0,
      currentLevel: 1,
      highScore: 0,
      totalBlocks: 0,
      totalHits: 0,
      totalSessions: 0,
      bestComboEver: 0,
      achievements: {},

      load: function () {
        try {
          const saved = localStorage.getItem('capoeiraVRData');
          if (saved) {
            const data = JSON.parse(saved);
            this.totalXP = data.totalXP || 0;
            this.currentLevel = data.currentLevel || 1;
            this.highScore = data.highScore || 0;
            this.totalBlocks = data.totalBlocks || 0;
            this.totalHits = data.totalHits || 0;
            this.totalSessions = data.totalSessions || 0;
            this.bestComboEver = data.bestComboEver || 0;
            this.achievements = data.achievements || {};
            this.currentDifficulty = data.currentDifficulty || 'normal';
          }
        } catch (e) {
          console.warn('Could not load game data:', e);
        }
        this.updateWelcomeScreen();
      },

      save: function () {
        try {
          localStorage.setItem('capoeiraVRData', JSON.stringify({
            totalXP: this.totalXP,
            currentLevel: this.currentLevel,
            highScore: this.highScore,
            totalBlocks: this.totalBlocks,
            totalHits: this.totalHits,
            totalSessions: this.totalSessions,
            bestComboEver: this.bestComboEver,
            achievements: this.achievements,
            currentDifficulty: this.currentDifficulty
          }));
        } catch (e) {
          console.warn('Could not save game data:', e);
        }
      },

      addXP: function (amount) {
        const multiplier = DIFFICULTY[this.currentDifficulty].xpMultiplier;
        const xpGained = Math.floor(amount * multiplier);
        this.totalXP += xpGained;

        // Check for level up
        const newLevel = this.calculateLevel();
        if (newLevel > this.currentLevel) {
          this.currentLevel = newLevel;
          this.onLevelUp(newLevel);
        }

        this.save();
        return xpGained;
      },

      calculateLevel: function () {
        for (let i = LEVELS.length - 1; i >= 0; i--) {
          if (this.totalXP >= LEVELS[i].xpRequired) {
            return LEVELS[i].level;
          }
        }
        return 1;
      },

      getLevelInfo: function () {
        const current = LEVELS[this.currentLevel - 1];
        const next = LEVELS[this.currentLevel] || current;
        const xpForNext = next.xpRequired - (LEVELS[this.currentLevel - 1]?.xpRequired || 0);
        const xpProgress = this.totalXP - (current?.xpRequired || 0);
        return { current, next, xpForNext, xpProgress };
      },

      onLevelUp: function (newLevel) {
        const levelInfo = LEVELS[newLevel - 1];
        gameScore.showAchievement(`LEVEL UP! ${levelInfo.name}`);

        // Check level achievements
        if (newLevel >= 5) gameScore.unlockAchievement('level5');
      },

      setDifficulty: function (diff) {
        this.currentDifficulty = diff;
        this.save();
        this.updateDifficultyUI();
      },

      updateDifficultyUI: function () {
        // Update welcome screen difficulty buttons
        const difficulties = ['easy', 'normal', 'hard'];
        difficulties.forEach(d => {
          const el = document.getElementById(`diff${d.charAt(0).toUpperCase() + d.slice(1)}`);
          if (el) {
            const bg = el.querySelector('a-rounded');
            if (bg) {
              if (d === this.currentDifficulty) {
                bg.setAttribute('color', d === 'easy' ? '#6bcb77' : d === 'normal' ? '#ffd93d' : '#ff6b6b');
                bg.setAttribute('opacity', '1');
              } else {
                bg.setAttribute('color', '#1a1a2e');
                bg.setAttribute('opacity', '0.9');
              }
            }
          }
        });

        // Update in-game difficulty text
        if (difficultyText) {
          difficultyText.setAttribute('text', 'value', DIFFICULTY[this.currentDifficulty].name);
        }
      },

      updateWelcomeScreen: function () {
        const levelInfo = this.getLevelInfo();

        if (welcomeLevelText) {
          welcomeLevelText.setAttribute('text', 'value', `Level ${this.currentLevel} - ${levelInfo.current.name}`);
          welcomeLevelText.setAttribute('text', 'color', levelInfo.current.color);
        }
        if (welcomeXPText) {
          welcomeXPText.setAttribute('text', 'value', `${levelInfo.xpProgress}/${levelInfo.xpForNext} XP to next level`);
        }
        if (welcomeHighScore) {
          welcomeHighScore.setAttribute('text', 'value', this.highScore.toString());
        }

        this.updateDifficultyUI();
      }
    };

    // --- SCORING SYSTEM ---
    const gameScore = {
      score: 0,
      combo: 0,
      bestCombo: 0,
      sessionXP: 0,
      comboTimeout: null,
      achievementTimeout: null,

      reset: function () {
        this.score = 0;
        this.combo = 0;
        this.bestCombo = 0;
        this.sessionXP = 0;
        this.updateUI();
      },

      addBlock: function () {
        const diff = DIFFICULTY[gameData.currentDifficulty];
        this.combo++;

        // Calculate points with combo multiplier
        const comboMultiplier = Math.min(this.combo, 10); // Cap at 10x
        const points = diff.blockPoints + (diff.comboBonus * (comboMultiplier - 1));
        this.score += points;

        // Track best combo
        if (this.combo > this.bestCombo) {
          this.bestCombo = this.combo;
        }
        if (this.combo > gameData.bestComboEver) {
          gameData.bestComboEver = this.combo;
        }

        // Reset combo timeout
        if (this.comboTimeout) clearTimeout(this.comboTimeout);
        this.comboTimeout = setTimeout(() => this.resetCombo(), 5000);

        // Check achievements
        if (this.combo === 1) this.unlockAchievement('firstBlock');
        if (this.combo === 5) this.unlockAchievement('combo5');
        if (this.combo === 10) this.unlockAchievement('combo10');
        if (combatFeedback.blockCount === 10) this.unlockAchievement('blocks10');
        if (combatFeedback.blockCount === 25) this.unlockAchievement('blocks25');
        if (this.score >= 500) this.unlockAchievement('score500');
        if (this.score >= 1000) this.unlockAchievement('score1000');

        this.updateUI();
        return points;
      },

      addHit: function () {
        const diff = DIFFICULTY[gameData.currentDifficulty];
        this.score = Math.max(0, this.score - diff.hitPenalty);
        this.resetCombo();
        this.updateUI();
      },

      resetCombo: function () {
        this.combo = 0;
        if (this.comboTimeout) {
          clearTimeout(this.comboTimeout);
          this.comboTimeout = null;
        }
        this.updateUI();
      },

      updateUI: function () {
        if (scoreText) scoreText.setAttribute('text', 'value', this.score.toString());

        if (comboText) {
          comboText.setAttribute('text', 'value', `${this.combo}x`);
          // Change color based on combo
          let color = '#00d4ff';
          if (this.combo >= 10) color = '#ffd93d';
          else if (this.combo >= 5) color = '#6bcb77';
          else if (this.combo >= 3) color = '#00d4ff';
          comboText.setAttribute('text', 'color', color);
        }

        if (comboBg && this.combo >= 3) {
          comboBg.setAttribute('color', this.combo >= 10 ? '#ffd93d' : this.combo >= 5 ? '#6bcb77' : '#1a1a2e');
          comboBg.setAttribute('opacity', this.combo >= 5 ? '0.95' : '0.85');
        } else if (comboBg) {
          comboBg.setAttribute('color', '#1a1a2e');
          comboBg.setAttribute('opacity', '0.85');
        }

        if (bestComboText) bestComboText.setAttribute('text', 'value', `Best: ${this.bestCombo}x`);

        // Update level panel
        const levelInfo = gameData.getLevelInfo();
        if (levelText) levelText.setAttribute('text', 'value', `Lv.${gameData.currentLevel}`);
        if (xpText) xpText.setAttribute('text', 'value', `${levelInfo.xpProgress}/${levelInfo.xpForNext} XP`);
      },

      unlockAchievement: function (id) {
        if (gameData.achievements[id]) return; // Already unlocked

        const achievement = ACHIEVEMENTS[id];
        if (!achievement) return;

        gameData.achievements[id] = true;
        gameData.save();

        this.showAchievement(achievement.name);
      },

      showAchievement: function (text) {
        if (!achievementPanel || !achievementText) return;

        if (this.achievementTimeout) clearTimeout(this.achievementTimeout);

        achievementText.setAttribute('text', 'value', text);
        achievementPanel.setAttribute('visible', true);

        this.achievementTimeout = setTimeout(() => {
          achievementPanel.setAttribute('visible', false);
        }, 3000);
      },

      endSession: function () {
        // Calculate XP based on performance
        const baseXP = Math.floor(this.score / 10);
        const comboBonus = this.bestCombo * 2;
        const blockBonus = combatFeedback.blockCount * 3;
        const hitPenalty = combatFeedback.hitCount * 2;

        this.sessionXP = Math.max(0, baseXP + comboBonus + blockBonus - hitPenalty);

        // Update high score
        if (this.score > gameData.highScore) {
          gameData.highScore = this.score;
        }

        // Update totals
        gameData.totalBlocks += combatFeedback.blockCount;
        gameData.totalHits += combatFeedback.hitCount;
        gameData.totalSessions++;

        // Add XP
        const xpGained = gameData.addXP(this.sessionXP);

        // Check hard mode achievement
        if (gameData.currentDifficulty === 'hard' && combatFeedback.blockCount > 0) {
          this.unlockAchievement('hardMode');
        }

        gameData.save();
        return { xpGained, sessionXP: this.sessionXP };
      },

      showSummary: function () {
        state.showingSummary = true;

        // Hide game UI
        const panels = [moveTitlePanel, instructionPanel, statsPanel, modePanel, combatFeedbackPanel, scorePanel, comboPanel, levelPanel, timerPanel];
        panels.forEach(p => p && p.setAttribute('visible', false));

        // Update summary screen
        const summaryScore = document.getElementById('summaryScore');
        const summaryBlocks = document.getElementById('summaryBlocks');
        const summaryBestCombo = document.getElementById('summaryBestCombo');
        const summaryHits = document.getElementById('summaryHits');
        const summaryXP = document.getElementById('summaryXP');
        const summaryLevel = document.getElementById('summaryLevel');

        if (summaryScore) summaryScore.setAttribute('text', 'value', this.score.toString());
        if (summaryBlocks) summaryBlocks.setAttribute('text', 'value', combatFeedback.blockCount.toString());
        if (summaryBestCombo) summaryBestCombo.setAttribute('text', 'value', `${this.bestCombo}x`);
        if (summaryHits) summaryHits.setAttribute('text', 'value', combatFeedback.hitCount.toString());
        if (summaryXP) summaryXP.setAttribute('text', 'value', `+${this.sessionXP} XP`);

        const levelInfo = gameData.getLevelInfo();
        if (summaryLevel) summaryLevel.setAttribute('text', 'value', `Level ${gameData.currentLevel} - ${levelInfo.current.name}`);

        summaryScreen.setAttribute('visible', true);
      },

      hideSummary: function () {
        state.showingSummary = false;
        summaryScreen.setAttribute('visible', false);
      },

      cleanup: function () {
        if (this.comboTimeout) clearTimeout(this.comboTimeout);
        if (this.achievementTimeout) clearTimeout(this.achievementTimeout);
      }
    };

    // Load saved game data on start
    gameData.load();

    // New gamification elements
    const scorePanel = document.getElementById("scorePanel");
    const scoreText = document.getElementById("scoreText");
    const comboPanel = document.getElementById("comboPanel");
    const comboText = document.getElementById("comboText");
    const comboBg = document.getElementById("comboBg");
    const levelPanel = document.getElementById("levelPanel");
    const levelText = document.getElementById("levelText");
    const xpText = document.getElementById("xpText");
    const achievementPanel = document.getElementById("achievementPanel");
    const achievementText = document.getElementById("achievementText");
    const summaryScreen = document.getElementById("summaryScreen");

    // --- A-FRAME COMPONENTS ---

    // Custom component for Y-axis rotation following
    AFRAME.registerComponent("follow-camera-y", {
      init: function () {
        this.cameraRig = document.getElementById("cameraRig");
      },
      tick: function () {
        if (!this.cameraRig) return;
        const cameraRigRotation = this.cameraRig.getAttribute("rotation");
        if (cameraRigRotation) {
          this.el.setAttribute("rotation", { x: 0, y: cameraRigRotation.y, z: 0 });
        }
      },
    });

    // Add the follow-camera-y component to the model container
    document.getElementById("modelContainer").setAttribute("follow-camera-y", "");

    // --- COMBAT FEEDBACK SYSTEM ---
    const combatFeedback = {
      hitCount: 0,
      blockCount: 0,
      lastHitTime: 0,
      screenFlash: null,
      flashTimeout: null,
      textTimeout: null,
      iconTimeout: null,

      get hitCooldown() {
        return DIFFICULTY[gameData.currentDifficulty].hitCooldown;
      },

      init: function () {
        this.screenFlash = document.getElementById('screenFlash');
      },

      reset: function () {
        this.hitCount = 0;
        this.blockCount = 0;
        this.lastHitTime = 0;
        this.updateStatsPanel();
      },

      triggerScreenFlash: function (color = 'red', duration = 150) {
        if (!this.screenFlash) return;

        if (this.flashTimeout) clearTimeout(this.flashTimeout);

        this.screenFlash.setAttribute('material', 'color', color);
        this.screenFlash.setAttribute('material', 'opacity', 0.6);

        this.flashTimeout = setTimeout(() => {
          this.screenFlash.setAttribute('material', 'opacity', 0);
        }, duration);
      },

      triggerHaptics: function (hand, intensity = 0.8, duration = 100) {
        const controller = hand === 'left' ? leftHand : rightHand;
        if (!controller || !controller.components['oculus-touch-controls']) return;

        const gamepad = controller.components['oculus-touch-controls'].controller;
        if (gamepad && gamepad.hapticActuators && gamepad.hapticActuators.length > 0) {
          gamepad.hapticActuators[0].pulse(intensity, duration);
        }
      },

      triggerBothHaptics: function (intensity = 1.0, duration = 150) {
        this.triggerHaptics('left', intensity, duration);
        this.triggerHaptics('right', intensity, duration);
      },

      updateStatsPanel: function () {
        if (hitsText) hitsText.setAttribute('text', 'value', `${this.hitCount} Hits`);
        if (blocksText) blocksText.setAttribute('text', 'value', `${this.blockCount} Blocks`);
      },

      updateStatusIcon: function (color) {
        if (!statusIcon) return;
        if (this.iconTimeout) clearTimeout(this.iconTimeout);

        statusIcon.setAttribute('material', 'color', color);

        this.iconTimeout = setTimeout(() => {
          statusIcon.setAttribute('material', 'color', '#00d4ff');
        }, 1500);
      },

      registerHit: function (attackerPart, targetPart) {
        const now = Date.now();
        if (now - this.lastHitTime < this.hitCooldown) return; // Prevent spam
        this.lastHitTime = now;

        this.hitCount++;

        // Update scoring
        gameScore.addHit();

        // Screen flash red - you got hit!
        this.triggerScreenFlash('red', 200);

        // Strong haptic on both controllers
        this.triggerBothHaptics(1.0, 200);

        // Update UI
        this.updateStatsPanel();
        this.updateStatusIcon('#ff6b6b');
        this.updateText(`HIT! -${DIFFICULTY[gameData.currentDifficulty].hitPenalty}`, '#ff6b6b');
      },

      registerBlock: function (attackerPart, blockerPart) {
        const now = Date.now();
        if (now - this.lastHitTime < this.hitCooldown) return;
        this.lastHitTime = now;

        this.blockCount++;

        // Update scoring
        const points = gameScore.addBlock();

        // Screen flash green - successful block!
        this.triggerScreenFlash('lime', 150);

        // Light haptic feedback
        this.triggerHaptics(blockerPart.includes('left') ? 'left' : 'right', 0.5, 100);

        // Update UI
        this.updateStatsPanel();
        this.updateStatusIcon('#6bcb77');

        // Show combo if active
        const comboText = gameScore.combo > 1 ? ` ${gameScore.combo}x COMBO!` : '';
        this.updateText(`+${points}${comboText}`, '#6bcb77');
      },

      registerPlayerStrike: function (playerPart, targetPart) {
        const now = Date.now();
        if (now - this.lastHitTime < this.hitCooldown) return;
        this.lastHitTime = now;

        // Screen flash blue - you landed a hit!
        this.triggerScreenFlash('cyan', 150);

        // Medium haptic
        this.triggerHaptics(playerPart.includes('left') ? 'left' : 'right', 0.6, 100);

        this.updateStatusIcon('#00d4ff');
        this.updateText(`NICE HIT!`, '#00d4ff');
      },

      updateText: function (message, color) {
        const collisionText = document.getElementById('collisionText');
        if (!collisionText) return;

        if (this.textTimeout) clearTimeout(this.textTimeout);

        collisionText.setAttribute('text', 'value', message);
        collisionText.setAttribute('text', 'color', color);

        this.textTimeout = setTimeout(() => {
          collisionText.setAttribute('text', 'value', 'Ready');
          collisionText.setAttribute('text', 'color', '#00d4ff');
        }, 2000);
      },

      cleanup: function () {
        if (this.flashTimeout) clearTimeout(this.flashTimeout);
        if (this.textTimeout) clearTimeout(this.textTimeout);
        if (this.iconTimeout) clearTimeout(this.iconTimeout);
      }
    };

    // Initialize combat feedback after DOM is ready
    document.addEventListener('DOMContentLoaded', () => combatFeedback.init());
    // Also try immediate init in case DOM is already loaded
    if (document.readyState !== 'loading') combatFeedback.init();

    // --- PLAYER COLLIDER COMPONENT ---
    // Attaches physics body to player's head and hands for collision detection
    AFRAME.registerComponent("player-collider", {
      schema: {
        bodyPart: { type: 'string', default: 'hand' },
        radius: { type: 'number', default: 0.1 }
      },
      init: function () {
        this.camera = document.getElementById('camera');
        this.worldPos = new THREE.Vector3();
        this._lastDebugLog = 0;

        const r = (this.data.bodyPart === 'head') ? 0.15 : 0.08;

        this.el.setAttribute('body', {
          type: 'dynamic',
          mass: 0.001,
          shape: 'sphere',
          sphereRadius: r,
          emitCollisionEvents: true,
          linearDamping: 0.99,
          angularDamping: 0.99
        });

        this.el.classList.add('player-body');
        this.el.setAttribute('data-body-part', this.data.bodyPart);

        // Debug: confirm the component is actually initializing
        console.log('[player-collider:init]', this.data.bodyPart, {
          elId: this.el.id || null,
          hasBody: !!this.el.body
        });
      },
      tick: function () {
        // Head collider follows camera position
        if (this.data.bodyPart === 'head' && this.camera) {
          this.camera.object3D.getWorldPosition(this.worldPos);
          this.el.object3D.position.copy(this.worldPos);

          if (this.el.body) {
            this.el.body.position.set(this.worldPos.x, this.worldPos.y, this.worldPos.z);
          }

          // Debug once per second
          // const now = Date.now();
          // if (now - this._lastDebugLog > 1000) {
          //   this._lastDebugLog = now;
          //   console.log('[player-collider:tick]', 'head', {
          //     x: +this.worldPos.x.toFixed(3),
          //     y: +this.worldPos.y.toFixed(3),
          //     z: +this.worldPos.z.toFixed(3),
          //     hasBody: !!this.el.body
          //   });
          // }
        }
        // Hand colliders automatically follow the controller via oculus-touch-controls
        // Just sync physics body position
        else if (this.el.body) {
          this.el.object3D.getWorldPosition(this.worldPos);
          this.el.body.position.set(this.worldPos.x, this.worldPos.y, this.worldPos.z);
        }
      }
    });

    // Logs all bone names in a loaded glTF model.
    AFRAME.registerComponent('log-bones', {
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const obj = this.el.getObject3D('mesh');
          if (!obj) {
            console.log('[log-bones] no mesh/object3D found');
            return;
          }

          const bones = [];
          obj.traverse((n) => {
            if (n && n.isBone) bones.push(n.name || '(unnamed)');
          });

          bones.sort();
          console.log(`[log-bones] bone count=${bones.length}`, bones);
        });
      }
    });

    // Contact/collision HUD
    const CONTACT_HUD_DURATION_MS = 800;
    const CONTACT_HUD_COOLDOWN_MS = 120;
    let _contactHudTimer = null;
    let _lastContactHudAt = 0;

    function showContactHUD() {
      const now = Date.now();
      if (now - _lastContactHudAt < CONTACT_HUD_COOLDOWN_MS) return;
      _lastContactHudAt = now;

      const el = document.getElementById('contactText');
      if (!el) return;

      el.setAttribute('text', 'value', "CONTACT!");
      el.setAttribute('visible', true);

      if (_contactHudTimer) clearTimeout(_contactHudTimer);
      _contactHudTimer = setTimeout(() => {
        el.setAttribute('visible', false);
        el.setAttribute('text', 'value', '');
      }, CONTACT_HUD_DURATION_MS);
    }

    // Custom component to create dynamic physics colliders for bones
    AFRAME.registerComponent("bone-collider-system", {
      schema: {
        bones: { type: 'array', default: ['mixamorigLeftFoot63', 'mixamorigRightFoot58', 'mixamorigLeftHand35', 'mixamorigRightHand11', 'mixamorigHead6'] },
        radius: { type: 'number', default: 0.15 }
      },
      init: function () {
        this.colliders = [];
        this.bones = [];
        this.timeouts = []; // Track timeouts for cleanup
        this.worldPos = new THREE.Vector3(); // Reuse vector for performance

        this.onModelLoaded = () => {
          const mesh = this.el.getObject3D('mesh');
          if (mesh) {
            this.data.bones.forEach(boneName => {
              mesh.traverse((node) => {
                if (node.isBone && node.name === boneName) {
                  this.bones.push(node);

                  const colliderEl = document.createElement('a-entity');

                  // Setup for C-Frame Physics (Cannon.js)
                  // type: kinematic = moves by code/animation, affects dynamic bodies
                  // shape: sphere = explicit shape avoids mesh parsing
                  colliderEl.setAttribute('body', {
                    type: 'kinematic',
                    shape: 'sphere',
                    sphereRadius: this.data.radius,
                    emitCollisionEvents: true
                  });

                  // Visual debug mesh (separate from physics body for clarity)
                  colliderEl.setAttribute('geometry', { primitive: 'sphere', radius: this.data.radius });
                  colliderEl.setAttribute('material', { color: 'red', opacity: 0.3, transparent: true });
                  colliderEl.setAttribute('visible', false); // Hide by default, set to true for debugging
                  colliderEl.setAttribute('class', `model-collider collider-${boneName}`);
                  colliderEl.setAttribute('data-bone-name', boneName);

                  // Determine if this is an offensive part (hand/foot)
                  const isOffensivePart = boneName.includes('Foot') || boneName.includes('Hand');
                  const friendlyName = this.getFriendlyBoneName(boneName);

                  // Add collision listener for player body parts
                  const onCollide = (e) => {
                    const otherEl = e.detail.body.el;
                    if (!otherEl) return;

                    // Check if collided with player body part
                    const playerBodyPart = otherEl.getAttribute('data-body-part');
                    if (playerBodyPart) {
                      console.log('[COLLISION]', {
                        time: new Date().toISOString(),
                        attackerBone: boneName,
                        attackerName: friendlyName,
                        targetBodyPart: playerBodyPart,
                        targetElId: otherEl.id || null,
                        score: gameScore?.score ?? null,
                        combo: gameScore?.combo ?? null,
                        hits: combatFeedback?.hitCount ?? null,
                        blocks: combatFeedback?.blockCount ?? null
                      });

                      // Model hit the player!
                      if (playerBodyPart === 'head') {
                        // Critical hit - model struck player's head
                        combatFeedback.registerHit(friendlyName, 'head');
                      } else if (playerBodyPart.includes('Hand')) {
                        // Player blocked with hand
                        combatFeedback.registerBlock(
                          friendlyName,
                          playerBodyPart.replace('left', 'left ').replace('right', 'right ').replace('Hand', 'hand')
                        );
                      } else {
                        // Hit other body part
                        combatFeedback.registerHit(friendlyName, playerBodyPart);
                      }

                      showContactHUD();

                      // Visual feedback on collider
                      colliderEl.setAttribute('material', 'color', 'yellow');
                      colliderEl.setAttribute('visible', true);
                      const colorTimeout = setTimeout(() => {
                        colliderEl.setAttribute('material', 'color', 'red');
                        colliderEl.setAttribute('visible', false);
                      }, 300);
                      this.timeouts.push(colorTimeout);
                    }
                  };

                  colliderEl.addEventListener('collide', onCollide);
                  this.el.sceneEl.appendChild(colliderEl);
                  this.colliders.push({ element: colliderEl, bone: node, boneName: boneName, onCollide: onCollide });
                }
              });
            });
          }
        };

        // Helper to convert bone names to friendly names
        this.getFriendlyBoneName = (boneName) => {
          const nameMap = {
            'mixamorigLeftFoot': 'Left Kick',
            'mixamorigRightFoot': 'Right Kick',
            'mixamorigLeftHand': 'Left Punch',
            'mixamorigRightHand': 'Right Punch'
          };
          return nameMap[boneName] || boneName;
        };

        this.el.addEventListener('model-loaded', this.onModelLoaded);
      },
      tick: function () {
        if (!this.colliders.length) return;

        this.colliders.forEach(({ element, bone }) => {
          if (!element.body) return; // Wait for physics body to initialize

          // Get the bone's current world position
          bone.getWorldPosition(this.worldPos);

          // 1. Update the visual entity position
          element.object3D.position.copy(this.worldPos);

          // 2. Update the physics body position
          // We use .set() to safely transfer data between Three.js and Cannon.js
          element.body.position.set(this.worldPos.x, this.worldPos.y, this.worldPos.z);

          // Note: We do NOT need to zero velocity here because kinematic bodies
          // do not accumulate velocity from gravity or collisions.
        });
      },
      remove: function () {
        // Clear all tracked timeouts
        this.timeouts.forEach(timeout => clearTimeout(timeout));
        this.timeouts = [];

        // Remove event listener
        this.el.removeEventListener('model-loaded', this.onModelLoaded);

        // Cleanup collider elements and their listeners
        this.colliders.forEach(({ element, onCollide }) => {
          element.removeEventListener('collide', onCollide);
          if (element.parentNode) element.parentNode.removeChild(element);
        });
        this.colliders = [];
        this.bones = [];
      }
    });

    // --- GAME FLOW FUNCTIONS ---

    function startGame() {
      if (state.isGameStarted) return;

      // If showing summary, dismiss it and return to welcome
      if (state.showingSummary) {
        gameScore.hideSummary();
        resetToWelcome();
        return;
      }

      state.isGameStarted = true;
      state.sessionStartTime = Date.now();

      // Reset session stats
      gameScore.reset();
      combatFeedback.reset();

      // Hide welcome screen
      welcomeScreen.setAttribute('visible', false);

      // Show game UI panels
      if (moveTitlePanel) moveTitlePanel.setAttribute('visible', true);
      if (instructionPanel) instructionPanel.setAttribute('visible', true);
      if (statsPanel) statsPanel.setAttribute('visible', true);
      if (modePanel) modePanel.setAttribute('visible', true);
      if (combatFeedbackPanel) combatFeedbackPanel.setAttribute('visible', true);
      if (scorePanel) scorePanel.setAttribute('visible', true);
      if (comboPanel) comboPanel.setAttribute('visible', true);
      if (levelPanel) levelPanel.setAttribute('visible', true);

      // Update instruction text
      if (instructionText) {
        instructionText.setAttribute('text', 'value', 'Press joystick for help');
      }

      // Update mode indicator
      if (modeText) {
        modeText.setAttribute('text', 'value', 'TRAINING');
        modeText.setAttribute('text', 'color', '#00d4ff');
      }

      // Apply difficulty animation speed
      const diff = DIFFICULTY[gameData.currentDifficulty];
      entity.setAttribute("animation-mixer", "timeScale", diff.animationSpeed);

      // Load first model
      updateModel(state.currentMoveType);
    }

    function endSession() {
      if (!state.isGameStarted) return;

      // Stop any active modes
      if (state.isRodaModeActive) {
        clearInterval(state.rodaInterval);
        state.rodaInterval = null;
        state.isRodaModeActive = false;
      }

      // Calculate and save session results
      gameScore.endSession();

      // Show summary
      gameScore.showSummary();
    }

    function resetToWelcome() {
      state.isGameStarted = false;
      state.isRodaModeActive = false;
      state.isChallengeMode = false;
      state.showingSummary = false;
      state.currentDefensiveIndex = DEFENSIVE_START_INDEX;
      state.currentOffensiveIndex = OFFENSIVE_START_INDEX;

      // Hide all game panels
      const panels = [moveTitlePanel, instructionPanel, statsPanel, modePanel, combatFeedbackPanel, scorePanel, comboPanel, levelPanel, timerPanel, summaryScreen, helpScreen];
      panels.forEach(p => p && p.setAttribute('visible', false));

      // Update and show welcome screen
      gameData.updateWelcomeScreen();
      welcomeScreen.setAttribute('visible', true);
    }

    function toggleHelpScreen() {
      if (!state.isGameStarted || state.showingSummary) return;
      state.isHelpVisible = !state.isHelpVisible;
      helpScreen.setAttribute("visible", state.isHelpVisible);

      // Hide/show other panels when help is visible
      const panels = [moveTitlePanel, instructionPanel, statsPanel, modePanel, combatFeedbackPanel, scorePanel, comboPanel, levelPanel];
      panels.forEach(p => p && p.setAttribute('visible', !state.isHelpVisible));
      if (timerPanel && state.isRodaModeActive) timerPanel.setAttribute('visible', !state.isHelpVisible);
    }

    function setDifficulty(diff) {
      if (state.isGameStarted) return; // Can't change during game
      gameData.setDifficulty(diff);
    }

    // --- MODEL UPDATE FUNCTIONS ---

    function getRandomMove(moveType) {
      const moves = moveData[moveType];
      const randomIndex = Math.floor(Math.random() * moves.length);
      return moves[randomIndex];
    }

    function getNextSequentialMove(moveType) {
      const moves = moveData[moveType];
      let currentIndex;

      if (moveType === 'offensive') {
        currentIndex = state.currentOffensiveIndex;
        state.currentOffensiveIndex = (currentIndex + 1) % moves.length;
      } else {
        currentIndex = state.currentDefensiveIndex;
        state.currentDefensiveIndex = (currentIndex + 1) % moves.length;
      }
      return moves[currentIndex];
    }

    function updateModel(moveType, isRodaMode = false) {
      state.currentMoveType = moveType;
      let move;

      if (isRodaMode) {
        move = getRandomMove(moveType);
      } else {
        move = getNextSequentialMove(moveType);
      }

      // Remove old collider system if exists
      if (entity.components['bone-collider-system']) {
        entity.removeAttribute('bone-collider-system');
      }

      entity.setAttribute('bone-collider-system', '');

      entity.setAttribute("src", move.id);

      // Re-add collider system after model loads
      entity.addEventListener('model-loaded', function addColliders() {
        entity.setAttribute('bone-collider-system', '');
        entity.removeEventListener('model-loaded', addColliders);
      }, { once: true });

      // Update move title (shorter format for new UI)
      if (moveTitleText) {
        moveTitleText.setAttribute('text', 'value', move.title);
      }

      // Update instruction based on move type
      if (instructionText) {
        instructionText.setAttribute(
          'text',
          'value',
          moveType === 'offensive' ? 'Dodge or block this attack!' : 'Study this defensive move'
        );
      }

      const yRotation = state.isFacingAway ? FACING_AWAY_ROTATION : DEFAULT_MODEL_ROTATION;
      entity.setAttribute("rotation", `0 ${yRotation} 0`);
    }

    // Set initial model for display on the welcome screen
    updateModel(state.currentMoveType);

    // --- RODA MODE FUNCTIONS ---

    function updateTimer() {
      if (timerText) {
        timerText.setAttribute('text', 'value', `${state.timeLeft}s`);
        // Color change when time is low
        const color = state.timeLeft <= 3 ? '#ff6b6b' : '#ffd93d';
        timerText.setAttribute('text', 'color', color);
      }
    }

    function startRodaSequence() {
      let isOffensive = Math.random() < 0.5;
      const rodaTime = DIFFICULTY[gameData.currentDifficulty].rodaTime;
      state.timeLeft = rodaTime;
      updateTimer();
      updateModel(isOffensive ? "offensive" : "defensive", true);

      state.rodaInterval = setInterval(() => {
        state.timeLeft--;
        updateTimer();

        if (state.timeLeft <= 0) {
          // Check for untouchable achievement (no hits this round)
          if (combatFeedback.hitCount === 0 && combatFeedback.blockCount > 0) {
            gameScore.unlockAchievement('noHits');
          }

          isOffensive = !isOffensive;
          state.timeLeft = rodaTime;
          updateModel(isOffensive ? "offensive" : "defensive", true);
        }
      }, 1000);
    }

    function stopRodaSequence() {
      clearInterval(state.rodaInterval);
      state.rodaInterval = null;
      state.currentDefensiveIndex = DEFENSIVE_START_INDEX;
      state.currentOffensiveIndex = OFFENSIVE_START_INDEX;
      updateModel("defensive", false);
    }

    function toggleRodaMode() {
      if (!state.isGameStarted || state.showingSummary) return;

      state.isRodaModeActive = !state.isRodaModeActive;

      // Show/hide timer panel
      if (timerPanel) timerPanel.setAttribute('visible', state.isRodaModeActive);

      // Update mode indicator
      if (modeText) {
        modeText.setAttribute('text', 'value', state.isRodaModeActive ? 'RODA MODE' : 'TRAINING');
        modeText.setAttribute('text', 'color', state.isRodaModeActive ? '#ffd93d' : '#00d4ff');
      }

      if (state.isRodaModeActive) {
        if (instructionText) {
          instructionText.setAttribute('text', 'value', 'Block the attacks!');
        }
        startRodaSequence();
      } else {
        if (instructionText) {
          instructionText.setAttribute('text', 'value', 'Training mode');
        }
        stopRodaSequence();
      }
    }

    // --- INPUT HANDLERS ---

    function handleGripDown() {
      if (!state.isGameStarted || state.showingSummary) return;
      entity.setAttribute("animation-mixer", "timeScale", SLOW_MOTION_SCALE);
    }

    function handleGripUp() {
      if (!state.isGameStarted || state.showingSummary) return;
      // Restore to difficulty-based speed
      const diff = DIFFICULTY[gameData.currentDifficulty];
      entity.setAttribute("animation-mixer", "timeScale", diff.animationSpeed);
    }

    function handleTriggerDown() {
      if (!state.isGameStarted || state.showingSummary) return;
      state.isFacingAway = !state.isFacingAway;
      const yRotation = state.isFacingAway ? FACING_AWAY_ROTATION : DEFAULT_MODEL_ROTATION;
      entity.setAttribute("rotation", `0 ${yRotation} 0`);
    }

    // --- EVENT LISTENERS ---

    function attachControllerEvents(controller) {
      controller.addEventListener("gripdown", handleGripDown);
      controller.addEventListener("gripup", handleGripUp);
      controller.addEventListener("triggerdown", handleTriggerDown);
      controller.addEventListener("thumbstickdown", toggleHelpScreen);

      if (controller.id === "leftHand") {
        // A button - Offensive move (in game) or Easy difficulty (menu)
        controller.addEventListener("abuttondown", () => {
          if (!state.isGameStarted && !state.showingSummary) {
            setDifficulty('easy');
          } else if (state.isGameStarted && !state.isRodaModeActive && !state.showingSummary) {
            updateModel("offensive");
          }
        });

        // B button - Defensive move (in game) or end session (in game)
        controller.addEventListener("bbuttondown", () => {
          if (state.isGameStarted && !state.showingSummary) {
            if (state.isRodaModeActive) {
              endSession(); // End session when in Roda mode
            } else {
              updateModel("defensive");
            }
          }
        });

        // X button - Roda mode (in game) or Normal difficulty (menu)
        controller.addEventListener("xbuttondown", () => {
          if (!state.isGameStarted && !state.showingSummary) {
            setDifficulty('normal');
          } else {
            toggleRodaMode();
          }
        });

        // Y button - Hard difficulty (menu only)
        controller.addEventListener("ybuttondown", () => {
          if (!state.isGameStarted && !state.showingSummary) {
            setDifficulty('hard');
          }
        });
      } else if (controller.id === "rightHand") {
        // A button - Roda mode toggle
        controller.addEventListener("abuttondown", () => {
          if (state.isGameStarted && !state.showingSummary) {
            toggleRodaMode();
          }
        });

        // B button - Start game / Continue from summary
        controller.addEventListener("bbuttondown", () => {
          if (state.showingSummary) {
            gameScore.hideSummary();
            resetToWelcome();
          } else {
            startGame();
          }
        });

        // Y button - End session (in game)
        controller.addEventListener("ybuttondown", () => {
          if (state.isGameStarted && !state.showingSummary) {
            endSession();
          }
        });
      }
    }

    if (leftHand) attachControllerEvents(leftHand);
    if (rightHand) attachControllerEvents(rightHand);

    // --- KEYBOARD DEBUG CONTROLS ---
    // Press "B" to cycle animations/models (useful when no VR controllers are connected).
    // Note: disabled during Roda mode to avoid fighting the timer-driven sequence.
    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      if (e.key && e.key.toLowerCase() === 'b') {
        if (state.showingSummary) return;
        if (state.isRodaModeActive) return;

        // Cycle to the next move within the current move type (defensive/offensive).
        updateModel(state.currentMoveType, false);
      }
    });

    // Cleanup on page unload to prevent memory leaks
    window.addEventListener('beforeunload', () => {
      if (state.rodaInterval) {
        clearInterval(state.rodaInterval);
        state.rodaInterval = null;
      }
      combatFeedback.cleanup();
      gameScore.cleanup();
      gameData.save();
    });

  </script>
